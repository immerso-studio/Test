<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Hand Tracking & Teleport</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

        let camera, scene, renderer;
        let cameraGroup; // Il contenitore che sposteremo per il teletrasporto
        let floor;
        
        let controller1, controller2;
        let hand1, hand2;

        const raycaster = new THREE.Raycaster();
        const tempMatrix = new THREE.Matrix4();
        
        // Indicatore di teletrasporto (un piccolo anello sul pavimento)
        let marker;

        init();
        animate();

        function init() {
            // 1. Setup Base
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x505050);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            
            // Creiamo un gruppo per la telecamera. Spostando questo gruppo, spostiamo l'utente.
            cameraGroup = new THREE.Group();
            cameraGroup.add(camera);
            scene.add(cameraGroup);

            // Luci
            scene.add(new THREE.HemisphereLight(0xbcbcbc, 0x444444, 3));
            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(0, 6, 0);
            light.castShadow = true;
            scene.add(light);

            // 2. Creazione dell'ambiente (Pavimento per il teletrasporto)
            const floorGeometry = new THREE.PlaneGeometry(20, 20);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1.0, metalness: 0.0 });
            floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Aggiungiamo qualche ostacolo/cubo per dare il senso della scala
            const cubeGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const cubeMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
            for(let i = 0; i < 50; i++) {
                const mesh = new THREE.Mesh(cubeGeo, cubeMat);
                mesh.position.set(Math.random() * 10 - 5, 0.25, Math.random() * 10 - 5);
                scene.add(mesh);
            }

            // Marker per il teletrasporto
            const markerGeo = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
            marker = new THREE.Mesh(markerGeo, markerMat);
            marker.visible = false;
            scene.add(marker);

            // 3. Setup Renderer e WebXR
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // 4. Controller e Hand Tracking
            // I "controller" in WebXR generano i raggi di puntamento anche quando si usano le mani (tramite il pinch)
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('select', onSelect);
            cameraGroup.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('select', onSelect);
            cameraGroup.add(controller2);

            // Aggiungiamo i modelli 3D delle mani
            const handModelFactory = new XRHandModelFactory();

            hand1 = renderer.xr.getHand(0);
            hand1.add(handModelFactory.createHandModel(hand1, "mesh"));
            cameraGroup.add(hand1);

            hand2 = renderer.xr.getHand(1);
            hand2.add(handModelFactory.createHandModel(hand2, "mesh"));
            cameraGroup.add(hand2);

            // Eventi finestra
            window.addEventListener('resize', onWindowResize);
        }

        function onSelect(event) {
            // Logica di teletrasporto al momento del "Pinch"
            const controller = event.target;
            
            // Calcola le intersezioni tra il controller e il pavimento
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                const destination = intersects[0].point;
                // Spostiamo il gruppo della telecamera sul punto colpito
                cameraGroup.position.set(destination.x, cameraGroup.position.y, destination.z);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // Aggiorna il marker di teletrasporto visivo (se vuoi mostrare dove stai puntando)
            // Controlliamo il controller 1 (mano destra solitamente)
            if (controller1) {
                tempMatrix.identity().extractRotation(controller1.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
                
                const intersects = raycaster.intersectObject(floor);
                if (intersects.length > 0) {
                    marker.position.copy(intersects[0].point);
                    marker.position.y += 0.01; // Solleva leggermente per evitare z-fighting
                    marker.visible = true;
                } else {
                    marker.visible = false;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
