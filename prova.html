<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Training VR Industriale</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: sans-serif; pointer-events: none; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Training Sicurezza VR - Premi il grilletto per interagire o teletrasportarti sul pavimento</div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        // 1. Configurazione Base
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x505050);

        // Usiamo un "Camera Rig" per poter muovere l'utente (teletrasporto)
        const cameraRig = new THREE.Group();
        cameraRig.position.set(0, 0, 3);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        cameraRig.add(camera);
        scene.add(cameraRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // Abilita WebXR
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // 2. Illuminazione
        scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // 3. Creazione dell'Ambiente
        // Pavimento (Area di teletrasporto)
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Array degli oggetti interattivi
        const interactables = [];

        // Stazione DPI (Tavolo)
        const tableGeometry = new THREE.BoxGeometry(2, 0.8, 1);
        const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const table = new THREE.Mesh(tableGeometry, tableMaterial);
        table.position.set(0, 0.4, -2);
        scene.add(table);

        // Caschetto (Semicosfera gialla)
        const helmetGeometry = new THREE.SphereGeometry(0.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const helmetMaterial = new THREE.MeshStandardMaterial({ color: 0xffd700 });
        const helmet = new THREE.Mesh(helmetGeometry, helmetMaterial);
        helmet.position.set(-0.5, 0.8, -2);
        helmet.userData = { info: "Caschetto di Sicurezza: Obbligatorio in cantiere." };
        scene.add(helmet);
        interactables.push(helmet);

        // Scarpe Antinfortunistiche (Cubi neri)
        const shoeGeometry = new THREE.BoxGeometry(0.15, 0.1, 0.25);
        const shoeMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const shoe = new THREE.Mesh(shoeGeometry, shoeMaterial);
        shoe.position.set(0.5, 0.85, -2);
        shoe.userData = { info: "Scarpe Antinfortunistiche: Protezione contro gli schiacciamenti." };
        scene.add(shoe);
        interactables.push(shoe);

        // Scheda Informativa (Pannello a muro)
        const boardGeom = new THREE.PlaneGeometry(1.5, 1);
        const boardMat = new THREE.MeshStandardMaterial({ color: 0x0055ff, side: THREE.DoubleSide });
        const board = new THREE.Mesh(boardGeom, boardMat);
        board.position.set(2, 1.5, -2);
        board.rotation.y = -Math.PI / 4;
        board.userData = { info: "TUTORIAL: Indossa sempre i DPI prima di entrare nell'area operativa." };
        scene.add(board);
        interactables.push(board);

        // 4. Controller VR e Raggi Laser (Raycaster)
        const controller1 = renderer.xr.getController(0);
        const controller2 = renderer.xr.getController(1);
        cameraRig.add(controller1);
        cameraRig.add(controller2);

        // Modelli visivi per i controller
        const controllerModelFactory = new XRControllerModelFactory();
        const grip1 = renderer.xr.getControllerGrip(0);
        grip1.add(controllerModelFactory.createControllerModel(grip1));
        cameraRig.add(grip1);

        const grip2 = renderer.xr.getControllerGrip(1);
        grip2.add(controllerModelFactory.createControllerModel(grip2));
        cameraRig.add(grip2);

        // Laser per puntare
        const laserGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -5)]);
        const laserMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
        const laser1 = new THREE.Line(laserGeometry, laserMaterial);
        const laser2 = new THREE.Line(laserGeometry, laserMaterial);
        controller1.add(laser1);
        controller2.add(laser2);

        // 5. Logica di Interazione e Teletrasporto
        const raycaster = new THREE.Raycaster();
        const tempMatrix = new THREE.Matrix4();

        function onSelectStart(event) {
            const controller = event.target;
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            // 1. Controlla interazioni con gli oggetti/tutorial
            const intersectsObjects = raycaster.intersectObjects(interactables);
            if (intersectsObjects.length > 0) {
                const object = intersectsObjects[0].object;
                console.log(object.userData.info);
                // In una vera app, qui aggiorneresti un testo su un Canvas 3D o riprodurresti un audio
                object.material.emissive.setHex(0x333333); // Feedback visivo
                setTimeout(() => object.material.emissive.setHex(0x000000), 500);
                return; // Ferma l'esecuzione per non teletrasportarsi sugli oggetti
            }

            // 2. Controlla il teletrasporto sul pavimento
            const intersectsFloor = raycaster.intersectObject(floor);
            if (intersectsFloor.length > 0) {
                const destination = intersectsFloor[0].point;
                // Sposta il Camera Rig al punto mirato
                cameraRig.position.set(destination.x, cameraRig.position.y, destination.z);
            }
        }

        controller1.addEventListener('selectstart', onSelectStart);
        controller2.addEventListener('selectstart', onSelectStart);

        // 6. Loop di Rendering
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
