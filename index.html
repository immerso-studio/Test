<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corso VR - Formazione Sicurezza</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <script>
    // COMPONENTE 1: Rimuove la linea bianca predefinita di A-Frame
    AFRAME.registerComponent('nascondi-laser', {
      init: function () {
        this.el.addEventListener('controllerconnected', () => {
          this.el.removeAttribute('line');
          this.el.setAttribute('raycaster', 'showLine', false);
        });
      }
    });

    // COMPONENTE 2: Corregge la rotazione del modello .GLB delle mani
    AFRAME.registerComponent('fix-rotazione-mani', {
      schema: {
        rotazione: {type: 'vec3', default: {x: 90, y: 180, z: 0}}
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          this.el.setAttribute('rotation', this.data.rotazione);
        });
      }
    });

    // COMPONENTE 3: Gestisce l'outline bianco sul sub-mesh "Tasto_cliccabile"
    AFRAME.registerComponent('outline-tasto', {
      init: function () {
        this.tastoMesh = null;
        this.outlineMesh = null;

        // 1. Cerca la mesh interna "Tasto_cliccabile" appena il GLB è caricato
        this.el.addEventListener('model-loaded', () => {
          const model = this.el.getObject3D('mesh');
          model.traverse((child) => {
            if (child.isMesh && child.name === 'Tasto_cliccabile') {
              this.tastoMesh = child;
            }
          });
        });

        // 2. Controlla continuamente dove sta puntando il raycaster sul macchinario
        this.el.addEventListener('raycaster-intersection', (evt) => {
          // Prendi il primo punto di contatto del raggio
          const intersection = evt.detail.intersections[0];
          
          if (intersection && intersection.object.name === 'Tasto_cliccabile') {
            this.mostraOutline();
          } else {
            // Se punta il macchinario ma NON il tasto, nascondi l'outline
            this.nascondiOutline();
          }
        });

        // 3. Se il controller si sposta completamente fuori dal macchinario
        this.el.addEventListener('raycaster-intersection-cleared', () => {
          this.nascondiOutline();
        });
      },

      mostraOutline: function () {
        // Evita di duplicare l'outline se esiste già o se la mesh non è pronta
        if (!this.tastoMesh || this.outlineMesh) return;

        // Tecnica Solid-Glow (Inversione delle facce) con Three.js
        const geometry = this.tastoMesh.geometry;
        const material = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          side: THREE.BackSide // Renderizza solo l'esterno del guscio
        });

        this.outlineMesh = new THREE.Mesh(geometry, material);
        
        // Copia posizione e rotazione locali dal tasto originale
        this.outlineMesh.position.copy(this.tastoMesh.position);
        this.outlineMesh.rotation.copy(this.tastoMesh.rotation);
        
        // Scala leggermente più grande (1.05 = +5%) per far sporgere l'outline bianco
        this.outlineMesh.scale.copy(this.tastoMesh.scale).multiplyScalar(1.05);

        // Aggiunge l'effetto direttamente dentro l'albero 3D del modello
        this.tastoMesh.parent.add(this.outlineMesh);
      },

      nascondiOutline: function () {
        if (!this.outlineMesh) return;

        // Rimuove l'oggetto e pulisce la memoria della GPU
        this.tastoMesh.parent.remove(this.outlineMesh);
        this.outlineMesh.geometry.dispose();
        this.outlineMesh.material.dispose();
        this.outlineMesh = null;
      }
    });
  </script>
</head>
<body>

  <a-scene environment="preset: default; groundColor: #445; grid: cross" cursor="rayOrigin: mouse">
    
    <a-assets>
      <a-asset-item id="industrial-machine" src="assets/macchinario.glb"></a-asset-item>
      <a-asset-item id="glb-mano" src="assets/mano_virtuale.glb"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0"></a-camera>

      <a-entity 
        id="leftHand"
        laser-controls="hand: left" 
        nascondi-laser
        raycaster="objects: .interattivo; far: 10; showLine: false"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #38bdf8; curveStyle: straight; rotateOnTeleport: false">
        
        <a-entity 
          gltf-model="#glb-mano" 
          fix-rotazione-mani="rotazione: 90 180 0">
        </a-entity>
      </a-entity>

      <a-entity 
        id="rightHand"
        laser-controls="hand: right" 
        nascondi-laser
        raycaster="objects: .interattivo; far: 10; showLine: false"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #38bdf8; curveStyle: straight; rotateOnTeleport: false">
        
        <a-entity 
          gltf-model="#glb-mano" 
          fix-rotazione-mani="rotazione: 90 0 0"> 
        </a-entity>
      </a-entity>
    </a-entity>

    <a-plane class="navigabile" rotation="-90 0 0" width="30" height="30" material="opacity: 0; transparent: true"></a-plane>

    <a-entity 
      gltf-model="#industrial-machine" 
      outline-tasto
      position="0 0 -3" 
      rotation="0 -90 0" 
      scale="0.07 0.07 0.07" 
      class="interattivo">
    </a-entity>

  </a-scene>
</body>
</html>
