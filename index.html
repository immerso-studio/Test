<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corso di Sicurezza VR - Area Metalmeccanica</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui-container {
      position: absolute; top: 20px; left: 20px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); color: #f8fafc;
      padding: 20px; border-radius: 8px; border: 1px solid #334155;
      max-width: 300px; pointer-events: none;
    }
    #ui-container h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #38bdf8; }
    #ui-container p { font-size: 0.9rem; margin: 0; line-height: 1.4; }
  </style>

  <script>
    // Componente aggiornato: mantiene la scala originale intatta
    AFRAME.registerComponent('macchinario-interattivo', {
      init: function () {
        let el = this.el;
        
        // Aspettiamo che il modello sia caricato per leggere la scala iniziale
        el.addEventListener('model-loaded', () => {
          // Memorizza la scala impostata nell'HTML (es. 0.01)
          this.baseScale = Object.assign({}, el.getAttribute('scale'));
        });

        el.addEventListener('mouseenter', () => {
          if (!this.baseScale) return;
          // Ingrandisce del 5% rispetto alla scala originale
          el.setAttribute('scale', {
            x: this.baseScale.x * 1.05,
            y: this.baseScale.y * 1.05,
            z: this.baseScale.z * 1.05
          });
        });

        el.addEventListener('mouseleave', () => {
          if (!this.baseScale) return;
          // Ripristina la scala originale esatta
          el.setAttribute('scale', this.baseScale);
        });

        el.addEventListener('mousedown', () => {
          console.log("Ispezione macchina avviata!");
        });
      }
    });
  </script>
</head>
<body>

  <div id="ui-container">
    <h1>Area Formazione Sicurezza</h1>
    <p>Usa il joystick per attivare l'arco di teletrasporto. Punta con il laser sul macchinario e premi il grilletto per ispezionarlo.</p>
  </div>

  <a-scene environment="preset: default; groundColor: #445; grid: cross" cursor="rayOrigin: mouse">
    
    <a-assets>
      <a-asset-item id="industrial-machine" src="assets/industrial_machine.glb"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0"></a-camera>

      <a-entity hand-controls="hand: left"></a-entity>
      <a-entity 
        laser-controls="hand: left" 
        raycaster="objects: .interattivo; far: 10"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: thumbstick; curveTint: #38bdf8; hitCylinderColor: #38bdf8">
      </a-entity>

      <a-entity hand-controls="hand: right"></a-entity>
      <a-entity 
        laser-controls="hand: right" 
        raycaster="objects: .interattivo; far: 10"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: thumbstick; curveTint: #38bdf8; hitCylinderColor: #38bdf8">
      </a-entity>
    </a-entity>

    <a-plane class="navigabile" rotation="-90 0 0" width="30" height="30" visible="false"></a-plane>

    <a-entity 
      gltf-model="#industrial-machine" 
      position="0 0 -2.5" 
      scale="0.01 0.01 0.01" 
      class="interattivo" 
      macchinario-interattivo>
    </a-entity>

    <a-entity position="0 2 -1.5" rotation="20 0 0">
      <a-plane width="2.2" height="1.2" color="#1e293b" opacity="0.95" border-radius="0.1"></a-plane>
      <a-text 
        value="PROCEDURE DI SICUREZZA\n\n1. Usa i Joystick per teletrasportarti.\n2. Punta il laser sulla macchina.\n3. Premi il grilletto per ispezionare."
        color="#f8fafc" width="2" position="-1 0.1 0.01" align="left" font="mozillavr">
      </a-text>
    </a-entity>

    <a-light type="ambient" color="#fff" intensity="0.6"></a-light>
    <a-light type="directional" color="#fff" intensity="0.8" position="-1 2 1"></a-light>

  </a-scene>

</body>
</html>
