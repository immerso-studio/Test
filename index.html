<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corso VR - Formazione Sicurezza</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <script>
    // Corregge la rotazione del modello .GLB delle mani
    AFRAME.registerComponent('fix-rotazione-mani', {
      schema: {
        rotazione: {type: 'vec3', default: {x: 90, y: 180, z: 0}}
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          this.el.setAttribute('rotation', this.data.rotazione);
        });
      }
    });

    // Outline bianco puro senza riempimento
    AFRAME.registerComponent('outline', {
      schema: {
        color: {default: '#ffffff'},
        scale: {default: 1.08},
        pulse: {default: false},
        frequency: {default: 1}
      },

      init: function () {
        this.el.addEventListener('loaded', () => {
          this.createOutline();
        });

        this.el.addEventListener('raycaster-intersected', () => {
          if (this.outlineMesh) {
            this.outlineMesh.visible = true;
          }
        });
        
        this.el.addEventListener('raycaster-intersected-cleared', () => {
          if (this.outlineMesh) {
            this.outlineMesh.visible = false;
          }
        });
      },

      createOutline: function () {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) {
          console.warn('outline: nessuna mesh trovata per', this.el);
          return;
        }

        const geometry = mesh.geometry.clone();
        
        const material = new THREE.MeshBasicMaterial({
          color: this.data.color,
          side: THREE.BackSide,
          depthTest: false,
          depthWrite: false,
          transparent: true,
          opacity: 1.0,
        });

        this.outlineMesh = new THREE.Mesh(geometry, material);
        this.outlineMesh.scale.setScalar(this.data.scale);
        this.outlineMesh.visible = false;
        this.outlineMesh.renderOrder = 999;
        
        this.el.object3D.add(this.outlineMesh);
      },

      tick: function (t) {
        if (this.data.pulse && this.outlineMesh) {
          const s = this.data.scale + 0.02 * Math.sin(this.data.frequency * t / 120);
          this.outlineMesh.scale.setScalar(s);
        }
      }
    });

    // Componente per sincronizzare teleport e laser
    AFRAME.registerComponent('sync-teleport-laser', {
      init: function () {
        this.synced = false;
        
        this.el.addEventListener('loaded', () => {
          this.setupSync();
        });
        
        setTimeout(() => {
          if (!this.synced) this.setupSync();
        }, 1000);
      },

      setupSync: function () {
        const blinkControls = this.el.components['blink-controls'];
        const raycaster = this.el.components['raycaster'];
        
        if (!blinkControls || !raycaster) return;
        
        blinkControls.data.curveTint = '#ffffff';
        blinkControls.data.curveOpacity = 0.8;
        
        if (blinkControls.raycaster && raycaster.raycaster) {
          Object.defineProperty(blinkControls, 'raycaster', {
            get: function() { return raycaster.raycaster; },
            configurable: true
          });
        }
        
        this.synced = true;
      },

      tick: function () {
        const blinkControls = this.el.components['blink-controls'];
        const raycaster = this.el.components['raycaster'];
        
        if (!blinkControls || !raycaster) return;
        
        if (blinkControls.curveMaterial) {
          blinkControls.curveMaterial.color.set('#ffffff');
          blinkControls.curveMaterial.opacity = 0.8;
        }
        
        if (raycaster.line) {
          if (blinkControls.isTeleporting) {
            raycaster.line.visible = false;
          } else if (raycaster.data.showLine) {
            raycaster.line.visible = true;
          }
        }
      }
    });

    // Sistema globale per gestire le schede informative
    AFRAME.registerSystem('info-card-system', {
      init: function () {
        this.activeCard = null;
        this.overlay = null;
        this.cardData = null;
      },

      createOverlay: function () {
        const camera = document.querySelector('#camera');
        if (!camera) return;

        // Overlay scuro per sfocare/scurire lo sfondo
        const overlay = document.createElement('a-entity');
        overlay.setAttribute('id', 'card-overlay');
        overlay.setAttribute('position', '0 0 -0.5');
        
        overlay.innerHTML = `
          <a-plane 
            position="0 0 0" 
            width="4" 
            height="3" 
            color="#000000" 
            material="shader: flat; opacity: 0.7; transparent: true; depthTest: false; depthWrite: false">
          </a-plane>
        `;
        
        camera.appendChild(overlay);
        this.overlay = overlay;
      },

      createCard: function (data) {
        // Rimuovi scheda esistente se presente
        if (this.activeCard) {
          this.activeCard.parentNode.removeChild(this.activeCard);
        }
        if (this.overlay) {
          this.overlay.parentNode.removeChild(this.overlay);
        }

        const camera = document.querySelector('#camera');
        if (!camera) return;

        // Crea overlay scuro prima della scheda
        this.createOverlay();

        // Crea la scheda come child della camera per seguirla
        const card = document.createElement('a-entity');
        card.setAttribute('id', 'info-card-follow');
        card.setAttribute('position', '0 0 -1.2');
        
        // Scheda con design migliorato e X ben visibile
        card.innerHTML = `
          <!-- Ombra della scheda -->
          <a-plane 
            position="0 -0.02 -0.005" 
            width="0.9" 
            height="0.7" 
            color="#000000" 
            material="shader: flat; opacity: 0.3; transparent: true; depthTest: false">
          </a-plane>
          
          <!-- Sfondo principale della scheda -->
          <a-plane 
            position="0 0 0" 
            width="0.85" 
            height="0.65" 
            color="#1a1a2e" 
            material="shader: flat; opacity: 1.0; depthTest: false">
          </a-plane>
          
          <!-- Bordo glow della scheda -->
          <a-plane 
            position="0 0 0.002" 
            width="0.87" 
            height="0.67" 
            color="#4cc9f0" 
            material="shader: flat; side: back; opacity: 0.6; depthTest: false">
          </a-plane>
          
          <!-- Bordo interno decorativo -->
          <a-plane 
            position="0 0 0.003" 
            width="0.83" 
            height="0.63" 
            color="#16213e" 
            material="shader: flat; side: double; opacity: 0.3; depthTest: false">
          </a-plane>
          
          <!-- Icona informazioni -->
          <a-circle 
            position="0 0.27 0.004" 
            radius="0.04" 
            color="#4cc9f0"
            material="depthTest: false">
          </a-circle>
          <a-text 
            position="0 0.27 0.005" 
            value="ℹ" 
            align="center" 
            color="#1a1a2e" 
            width="0.06"
            font="mozillavr">
          </a-text>
          
          <!-- Titolo -->
          <a-text 
            position="0 0.22 0.004" 
            value="${data.title || 'Informazioni'}" 
            align="center" 
            color="#ffffff" 
            width="0.7"
            font="mozillavr">
          </a-text>
          
          <!-- Linea separatrice -->
          <a-plane 
            position="0 0.14 0.004" 
            width="0.65" 
            height="0.003" 
            color="#4cc9f0"
            material="depthTest: false">
          </a-plane>
          
          <!-- Descrizione -->
          <a-text 
            position="0 -0.08 0.004" 
            value="${data.description || 'Nessuna descrizione disponibile'}" 
            align="center" 
            color="#e0e0e0" 
            width="0.7"
            font="mozillavr">
          </a-text>
          
          <!-- Bottone X per chiudere - Più grande e visibile -->
          <a-circle 
            id="close-button-bg"
            position="0.38 0.28 0.005" 
            radius="0.06" 
            color="#f72585"
            material="shader: flat; depthTest: false"
            class="close-button">
          </a-circle>
          
          <!-- Bordo del bottone X -->
          <a-circle 
            id="close-button-border"
            position="0.38 0.28 0.004" 
            radius="0.065" 
            color="#ffffff" 
            material="shader: flat; side: back; depthTest: false"
            class="close-button">
          </a-circle>
          
          <!-- Testo X -->
          <a-text 
            id="close-button-text"
            position="0.38 0.28 0.006" 
            value="✕" 
            align="center" 
            color="#ffffff" 
            width="0.08"
            font="mozillavr"
            class="close-button">
          </a-text>
          
          <!-- Etichetta "Chiudi" sotto la X -->
          <a-text 
            position="0.38 0.18 0.004" 
            value="Chiudi" 
            align="center" 
            color="#cccccc" 
            width="0.15"
            font="mozillavr"
            scale="0.7 0.7 0.7">
          </a-text>
        `;
        
        camera.appendChild(card);
        this.activeCard = card;
        this.cardData = data;

        // Aggiungi listener per il bottone di chiusura
        setTimeout(() => {
          const closeElements = document.querySelectorAll('.close-button');
          closeElements.forEach(element => {
            element.addEventListener('click', () => this.hideCard());
            // Aggiungi hover effect
            element.addEventListener('mouseenter', () => {
              const bg = document.querySelector('#close-button-bg');
              if (bg) bg.setAttribute('color', '#ff6b9d');
            });
            element.addEventListener('mouseleave', () => {
              const bg = document.querySelector('#close-button-bg');
              if (bg) bg.setAttribute('color', '#f72585');
            });
          });
        }, 100);
      },

      hideCard: function () {
        if (this.activeCard) {
          this.activeCard.parentNode.removeChild(this.activeCard);
          this.activeCard = null;
          this.cardData = null;
        }
        if (this.overlay) {
          this.overlay.parentNode.removeChild(this.overlay);
          this.overlay = null;
        }
      },

      isCardVisible: function () {
        return this.activeCard !== null;
      }
    });

    // Componente per gestire l'apertura delle schede dagli oggetti
    AFRAME.registerComponent('info-card-trigger', {
      schema: {
        title: {type: 'string', default: 'Informazioni'},
        description: {type: 'string', default: 'Descrizione dettagliata dell\'oggetto selezionato.'}
      },

      init: function () {
        this.system = document.querySelector('a-scene').systems['info-card-system'];
        
        this.el.addEventListener('raycaster-intersected', (e) => {
          this.intersected = true;
        });
        
        this.el.addEventListener('raycaster-intersected-cleared', (e) => {
          this.intersected = false;
        });
      },

      openCard: function () {
        if (this.intersected && this.system) {
          if (this.system.isCardVisible()) {
            this.system.hideCard();
          } else {
            this.system.createCard({
              title: this.data.title,
              description: this.data.description
            });
          }
        }
      }
    });

    // Componente per gestire gli input dei controller
    AFRAME.registerComponent('controller-input', {
      init: function () {
        this.system = document.querySelector('a-scene').systems['info-card-system'];
        
        this.el.addEventListener('xbuttondown', () => {
          this.triggerInfoCard();
        });
        
        this.el.addEventListener('abuttondown', () => {
          this.triggerInfoCard();
        });
        
        this.el.addEventListener('click', () => {
          this.triggerInfoCard();
        });
      },

      triggerInfoCard: function () {
        const intersectedObjects = document.querySelectorAll('.interattivo');
        let activeObject = null;
        
        intersectedObjects.forEach(obj => {
          if (obj.components['info-card-trigger'] && obj.components['info-card-trigger'].intersected) {
            activeObject = obj;
          }
        });
        
        if (activeObject) {
          activeObject.components['info-card-trigger'].openCard();
        }
      }
    });
  </script>

  <style>
    .instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 1000;
      text-align: center;
      line-height: 1.6;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <a-scene environment="preset: default; groundColor: #445; grid: cross" cursor="rayOrigin: mouse">
    
    <a-assets>
      <a-asset-item id="glb-mano" src="assets/mano_virtuale.glb"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0"></a-camera>

      <!-- Controller sinistro -->
      <a-entity 
        id="leftHand"
        laser-controls="hand: left" 
        raycaster="objects: .interattivo; far: 10; showLine: true; lineColor: #ffffff; lineOpacity: 0.8"
        line="color: #ffffff; opacity: 0.8"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #ffffff; curveOpacity: 0.8; curveStyle: straight; rotateOnTeleport: false"
        sync-teleport-laser
        controller-input>
        
        <a-entity 
          gltf-model="#glb-mano" 
          fix-rotazione-mani="rotazione: 90 180 0">
        </a-entity>
      </a-entity>

      <!-- Controller destro -->
      <a-entity 
        id="rightHand"
        laser-controls="hand: right" 
        raycaster="objects: .interattivo; far: 10; showLine: true; lineColor: #ffffff; lineOpacity: 0.8"
        line="color: #ffffff; opacity: 0.8"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #ffffff; curveOpacity: 0.8; curveStyle: straight; rotateOnTeleport: false"
        sync-teleport-laser
        controller-input>
        
        <a-entity 
          gltf-model="#glb-mano" 
          fix-rotazione-mani="rotazione: 90 0 0"> 
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Piano navigabile trasparente -->
    <a-plane class="navigabile" rotation="-90 0 0" width="30" height="30" material="opacity: 0; transparent: true"></a-plane>

    <!-- Oggetti interattivi con schede informative -->
    <a-box 
      id="box-sicurezza"
      position="-2 1.2 -3" 
      color="#4cc9f0" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;"
      info-card-trigger="title: Box Sicurezza; description: Questo box rappresenta un modulo di sicurezza base. Contiene informazioni essenziali per la protezione sul lavoro e le normative vigenti.">
    </a-box>

    <a-sphere 
      id="sphere-sicurezza"
      position="0 1.2 -3" 
      radius="0.5" 
      color="#f72585" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;"
      info-card-trigger="title: Sfera Interattiva; description: Elemento sferico per esercitazioni pratiche di formazione VR. Tocca per maggiori dettagli sulla sicurezza interattiva.">
    </a-sphere>

    <a-cone 
      id="cone-sicurezza"
      position="2 1.2 -3" 
      color="#7209b7" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;"
      info-card-trigger="title: Cono Segnaletico; description: Rappresenta un punto di interesse per la segnaletica di sicurezza. Importante per la prevenzione incidenti sul luogo di lavoro.">
    </a-cone>

  </a-scene>

  <div class="instructions">
    🖐️ Entrambe le mani: Trigger per Teletrasporto<br>
    📄 Tasto X (sinistra) o A (destra): Apri scheda<br>
    ✕ Clicca il bottone rosa per chiudere<br>
    🌑 Sfondo scurito durante la lettura
  </div>

</body>
</html>
