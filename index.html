<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training VR Industriale - Nuovi DPI, Macchinario ed Emergenza</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // -----------------------------------------------------------------
        // CONFIGURAZIONE AMBIENTE E CAMERA RIG
        // -----------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.06);

        const cameraRig = new THREE.Group();
        cameraRig.position.set(0, 0, 2); 
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        cameraRig.add(camera);
        scene.add(cameraRig);

        // -----------------------------------------------------------------
        // CONFIGURAZIONE AUDIO
        // -----------------------------------------------------------------
        const audioListener = new THREE.AudioListener();
        camera.add(audioListener);
        const rumoreAudio = new THREE.Audio(audioListener);
        const audioLoader = new THREE.AudioLoader();
        audioLoader.load('assets/rumore.mp3', (buffer) => {
            rumoreAudio.setBuffer(buffer);
            rumoreAudio.setLoop(true);
            rumoreAudio.setVolume(0.5);
        }, undefined, (err) => console.warn("Audio rumore.mp3 non trovato. Ignorare se non caricato."));

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; 
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(3, 10, 3);
        scene.add(dirLight);

        // Pavimento
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.name = 'floor'; 
        scene.add(floor);

        const grid = new THREE.GridHelper(40, 40, 0x333333, 0x222222);
        grid.position.y = 0.001;
        scene.add(grid);

        // Banco da lavoro
        const table = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x2b2b2b })
        );
        table.position.set(0, 0.4, -1.5);
        table.name = 'table';
        scene.add(table);

        const interactables = [];
        const environmentColliders = [floor, table]; 

        // -----------------------------------------------------------------
        // CARICAMENTO MACCHINARIO E OSTACOLO FISICO
        // -----------------------------------------------------------------
        const gltfLoader = new GLTFLoader();
        
        const componentiMacchinario = {
            "Cabina_di_controllo_metallo": { id: "cabina", title: "Cabina di Controllo", info: "Pannello principale per la gestione della macchina. Verificare che non vi siano spie d'allarme attive." },
            "Tasto_rosso": { id: "tasto_emergenza", title: "Pulsante di Emergenza", info: "Blocca istantaneamente l'alimentazione in caso di pericolo. Assicurati che sia ben visibile e non ostruito." }
        };

        gltfLoader.load('assets/macchinario.glb', (gltf) => {
            const machineModel = gltf.scene;
            machineModel.position.set(-1, 0, -3.5); 
            machineModel.name = 'macchinario';
            scene.add(machineModel);
            environmentColliders.push(machineModel);

            machineModel.traverse((child) => {
                if (child.isMesh && componentiMacchinario[child.name]) {
                    const datiComponente = componentiMacchinario[child.name];
                    child.userData.isInteractable = true; 
                    child.userData.id = datiComponente.id; 
                    child.userData.title = datiComponente.title; 
                    child.userData.info = datiComponente.info;
                    child.userData.isFaseMacchinario = true;
                    interactables.push(child);
                }
            });
        }, undefined, (error) => { console.warn("Modello macchinario non trovato, procedo senza:", error); });


        // -----------------------------------------------------------------
        // CONFIGURAZIONE DI STATO E DATI DEL TUTORIAL
        // -----------------------------------------------------------------
        let isTutorialActive = true;
        let tutorialIndex = 0;
        let isHoveringButton = false;

        const tutorialSlides = [
            { title: "1. INDICATORE VR", text: "Questo cerchio azzurro mostra la tua prossima destinazione operativa o i punti di interesse attivi nell'area di addestramento.", imgSrc: "assets/tutorial/1.webp", imgObj: null },
            { title: "2. INTERAZIONE OGGETTI", text: "Punta un oggetto con il raggio laser e premi i tasti 'A' (Controller Destro) o 'X' (Controller Sinistro) per aprire o chiudere la sua scheda informativa.", imgSrc: "assets/tutorial/2.webp", imgObj: null },
            { title: "3. TELETRASPORTO DI MOVIMENTO", text: "Tieni premuto il Trigger (Grilletto posteriore) per proiettare il raggio di spostamento azzurro. Rilascialo per teletrasportarti nel punto mirato.", imgSrc: "assets/tutorial/3.webp", imgObj: null }
        ];

        const tutorialCanvas = document.createElement('canvas'); tutorialCanvas.width = 512; tutorialCanvas.height = 512;
        const tutCtx = tutorialCanvas.getContext('2d');
        const tutorialTexture = new THREE.CanvasTexture(tutorialCanvas);

        const tutorialMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(0.5, 0.5), 
            new THREE.MeshBasicMaterial({ map: tutorialTexture, side: THREE.DoubleSide, transparent: true })
        );
        const tutorialGroup = new THREE.Group();
        tutorialGroup.add(tutorialMesh);
        camera.add(tutorialGroup);
        tutorialGroup.position.set(0, 0, -0.65); 

        function wrapTextCentrato(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' '); let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight;
                } else { line = testLine; }
            } ctx.fillText(line, x, y);
        }

        function disegnaTutorialHUD() {
            if (tutorialIndex >= tutorialSlides.length) return;
            const slide = tutorialSlides[tutorialIndex];

            tutCtx.clearRect(0, 0, 512, 512);
            tutCtx.fillStyle = 'rgba(20, 20, 20, 0.98)'; tutCtx.fillRect(0, 0, 512, 512);
            tutCtx.strokeStyle = 'rgba(0, 210, 255, 0.4)'; tutCtx.lineWidth = 6; tutCtx.strokeRect(0, 0, 512, 512);

            tutCtx.fillStyle = '#ffffff'; tutCtx.font = 'bold 24px sans-serif'; tutCtx.textAlign = 'center';
            tutCtx.fillText(slide.title, 256, 55);

            if (slide.imgObj) {
                const imgSize = 180; 
                tutCtx.drawImage(slide.imgObj, 256 - imgSize / 2, 95, imgSize, imgSize);
            }

            tutCtx.fillStyle = '#cccccc'; tutCtx.font = '16px sans-serif'; tutCtx.textAlign = 'center';
            wrapTextCentrato(tutCtx, slide.text, 256, 315, 420, 24);

            tutCtx.fillStyle = isHoveringButton ? '#00bcff' : '#0055ff'; 
            tutCtx.fillRect(102, 435, 308, 51);

            tutCtx.fillStyle = '#ffffff'; tutCtx.font = 'bold 18px sans-serif';
            tutCtx.fillText(tutorialIndex === tutorialSlides.length - 1 ? "INIZIA TRAINING" : "PROSEGUI (A / X)", 256, 467);

            tutorialTexture.needsUpdate = true;
        }

        let loadedImagesCount = 0;
        tutorialSlides.forEach((slide) => {
            const img = new Image(); img.src = slide.imgSrc;
            img.onload = () => {
                slide.imgObj = img; loadedImagesCount++;
                if (loadedImagesCount === tutorialSlides.length) disegnaTutorialHUD();
            };
        });

        // -----------------------------------------------------------------
        // CONFIGURAZIONE LOCATION POINTERS 
        // -----------------------------------------------------------------
        const stageMarkerMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const coneGeo = new THREE.ConeGeometry(0.08, 0.2, 4).rotateX(Math.PI); 

        // TAPPA 1: Banco da lavoro
        const targetStage1 = new THREE.Vector3(0, 0.01, -0.6); 
        let stage1Triggered = false;
        const locationPointerGroup1 = new THREE.Group();
        locationPointerGroup1.position.copy(targetStage1);
        locationPointerGroup1.visible = false; 
        scene.add(locationPointerGroup1);
        
        const stageMarker1 = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.35, 32).rotateX(-Math.PI / 2), stageMarkerMat);
        const stageTriangle1 = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({ color: 0x00d2ff }));
        stageTriangle1.position.y = 0.5; 
        locationPointerGroup1.add(stageMarker1); locationPointerGroup1.add(stageTriangle1);

        // TAPPA 2: Macchinario
        const targetStage2 = new THREE.Vector3(3, 0.01, -2.4); 
        let stage2Triggered = false;
        const locationPointerGroup2 = new THREE.Group();
        locationPointerGroup2.position.copy(targetStage2);
        locationPointerGroup2.visible = false; 
        scene.add(locationPointerGroup2);

        const stageMarker2 = stageMarker1.clone();
        const stageTriangle2 = stageTriangle1.clone();
        locationPointerGroup2.add(stageMarker2); locationPointerGroup2.add(stageTriangle2);

        // TAPPA 3: Allarme Emergenza Macchinario
        const targetStage3 = new THREE.Vector3(1, 0.01, -2.8); // Vicino al macchinario
        let stage3Triggered = false;
        let emergenzaRisolta = false;
        const locationPointerGroup3 = new THREE.Group();
        locationPointerGroup3.position.copy(targetStage3);
        locationPointerGroup3.visible = false; 
        scene.add(locationPointerGroup3);

        const stageMarker3 = stageMarker1.clone();
        const stageTriangle3 = stageTriangle1.clone();
        locationPointerGroup3.add(stageMarker3); locationPointerGroup3.add(stageTriangle3);

        // Variabili Logica DPI (Fase 1)
        const inspectedObjects = new Set(); 
        const totalObjectsToInspect = 3;
        let taskCompleted = false;

        // Variabili Logica Macchinario (Fase 2)
        const macchinarioInspectedObjects = new Set();
        const totalMacchinarioObjects = 2;
        let macchinarioTaskCompleted = false;


        // -----------------------------------------------------------------
        // CREAZIONE SCHEDA OBIETTIVO 1 (Fissa sul Banco)
        // -----------------------------------------------------------------
        const objCanvas = document.createElement('canvas'); objCanvas.width = 512; objCanvas.height = 320;
        const objCtx = objCanvas.getContext('2d');
        const objTexture = new THREE.CanvasTexture(objCanvas);

        const objPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.5), new THREE.MeshBasicMaterial({ map: objTexture, side: THREE.DoubleSide, transparent: true }));
        const objectiveGroup = new THREE.Group();
        objectiveGroup.add(objPanelMesh);
        scene.add(objectiveGroup); 
        objectiveGroup.position.set(0, 1.45, -1.96); 
        objectiveGroup.visible = false; 

        function disegnaSchedaObiettivo3D() {
            objCtx.clearRect(0, 0, 512, 320);
            objCtx.fillStyle = 'rgba(15, 15, 15, 0.95)'; objCtx.fillRect(0, 0, 512, 320);
            
            if (taskCompleted) {
                objCtx.strokeStyle = '#00ff66'; objCtx.lineWidth = 6; objCtx.strokeRect(0, 0, 512, 320);
                objCtx.fillStyle = '#00ff66'; objCtx.font = 'bold 24px sans-serif'; objCtx.textAlign = 'left'; objCtx.fillText("✔ OBIETTIVO COMPLETATO", 40, 60);
                objCtx.fillStyle = '#ffffff'; objCtx.font = '18px sans-serif'; objCtx.fillText("Tutti i DPI sul banco sono stati verificati.", 40, 130);
                objCtx.fillStyle = '#00d2ff'; objCtx.font = 'bold 16px sans-serif'; objCtx.fillText("RAGGIUNGI IL MACCHINARIO SUL RETRO", 40, 240);
            } else {
                objCtx.strokeStyle = 'rgba(0, 210, 255, 0.5)'; objCtx.lineWidth = 6; objCtx.strokeRect(0, 0, 512, 320);
                objCtx.fillStyle = '#00d2ff'; objCtx.font = 'bold 22px sans-serif'; objCtx.textAlign = 'left'; objCtx.fillText("OBIETTIVO: ISPEZIONE DPI", 40, 60);
                objCtx.fillStyle = '#cccccc'; objCtx.font = '16px sans-serif';
                wrapTextCentrato(objCtx, "Seleziona ed apri la scheda informativa di tutti e tre i dispositivi di protezione presenti sul tavolo per verificarne la conformità tecnica prima di iniziare i lavori.", 40, 110, 432, 26);
                objCtx.fillStyle = '#ffffff'; objCtx.font = 'bold 18px sans-serif'; objCtx.fillText(`DPI Ispezionati: ${inspectedObjects.size} / ${totalObjectsToInspect}`, 40, 260);
            }
            objTexture.needsUpdate = true;
        }

        // -----------------------------------------------------------------
        // CREAZIONE SCHEDA OBIETTIVO 2 E 3 (Warning) AL MACCHINARIO
        // -----------------------------------------------------------------
        const machObjCanvas = document.createElement('canvas'); machObjCanvas.width = 512; machObjCanvas.height = 320;
        const machObjCtx = machObjCanvas.getContext('2d');
        const machObjTexture = new THREE.CanvasTexture(machObjCanvas);

        const machObjPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.5), new THREE.MeshBasicMaterial({ map: machObjTexture, side: THREE.DoubleSide, transparent: true }));
        const machObjectiveGroup = new THREE.Group();
        machObjectiveGroup.add(machObjPanelMesh);
        scene.add(machObjectiveGroup); 
        machObjectiveGroup.position.set(3, 1.8, -3.2); 
        machObjectiveGroup.rotation.y = -Math.PI / 6; 
        machObjectiveGroup.visible = false; 

        function disegnaSchedaObiettivoMacchinario3D() {
            machObjCtx.clearRect(0, 0, 512, 320);
            machObjCtx.fillStyle = 'rgba(15, 15, 15, 0.95)'; machObjCtx.fillRect(0, 0, 512, 320);
            
            if (macchinarioTaskCompleted) {
                machObjCtx.strokeStyle = '#00ff66'; machObjCtx.lineWidth = 6; machObjCtx.strokeRect(0, 0, 512, 320);
                machObjCtx.fillStyle = '#00ff66'; machObjCtx.font = 'bold 24px sans-serif'; machObjCtx.textAlign = 'left'; machObjCtx.fillText("✔ ISPEZIONE CONCLUSA", 40, 60);
                machObjCtx.fillStyle = '#ffffff'; machObjCtx.font = '18px sans-serif'; machObjCtx.fillText("Spostati verso la pedana a lato della macchina.", 40, 130);
            } else {
                machObjCtx.strokeStyle = 'rgba(255, 165, 0, 0.5)'; machObjCtx.lineWidth = 6; machObjCtx.strokeRect(0, 0, 512, 320);
                machObjCtx.fillStyle = '#ffa500'; machObjCtx.font = 'bold 22px sans-serif'; machObjCtx.textAlign = 'left'; machObjCtx.fillText("OBIETTIVO: VERIFICA MACCHINARIO", 40, 60);
                machObjCtx.fillStyle = '#cccccc'; machObjCtx.font = '16px sans-serif';
                wrapTextCentrato(machObjCtx, "Identifica e visualizza le specifiche della Cabina di Controllo e del Tasto Rosso di Emergenza sul macchinario.", 40, 110, 432, 26);
                machObjCtx.fillStyle = '#ffffff'; machObjCtx.font = 'bold 18px sans-serif'; machObjCtx.fillText(`Componenti Trovati: ${macchinarioInspectedObjects.size} / ${totalMacchinarioObjects}`, 40, 260);
            }
            machObjTexture.needsUpdate = true;
        }
        disegnaSchedaObiettivoMacchinario3D(); 

        // -- SCHEDA WARNING (Fase 3) --
        const warningCanvas = document.createElement('canvas'); warningCanvas.width = 512; warningCanvas.height = 320;
        const warningCtx = warningCanvas.getContext('2d');
        const warningTexture = new THREE.CanvasTexture(warningCanvas);

        const warningPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.5), new THREE.MeshBasicMaterial({ map: warningTexture, side: THREE.DoubleSide, transparent: true }));
        const warningGroup = new THREE.Group();
        warningGroup.add(warningPanelMesh);
        scene.add(warningGroup); 
        warningGroup.position.set(1, 1.8, -3.8); // Più vicino all'area di emergenza
        warningGroup.rotation.y = -Math.PI / 10;
        warningGroup.visible = false; 

        function disegnaSchedaWarning() {
            warningCtx.clearRect(0, 0, 512, 320);
            
            if (emergenzaRisolta) {
                warningCtx.fillStyle = 'rgba(10, 25, 10, 0.95)'; warningCtx.fillRect(0, 0, 512, 320);
                warningCtx.strokeStyle = '#00ff66'; warningCtx.lineWidth = 6; warningCtx.strokeRect(0, 0, 512, 320);
                warningCtx.fillStyle = '#00ff66'; warningCtx.font = 'bold 24px sans-serif'; warningCtx.textAlign = 'left'; warningCtx.fillText("✔ MACCHINARIO IN SICUREZZA", 40, 60);
                warningCtx.fillStyle = '#ffffff'; warningCtx.font = '18px sans-serif';
                wrapTextCentrato(warningCtx, "Hai interrotto correttamente l'alimentazione premendo il tasto d'emergenza. Addestramento completato.", 40, 120, 432, 26);
            } else {
                warningCtx.fillStyle = 'rgba(30, 0, 0, 0.95)'; warningCtx.fillRect(0, 0, 512, 320);
                warningCtx.strokeStyle = 'rgba(255, 0, 0, 0.8)'; warningCtx.lineWidth = 6; warningCtx.strokeRect(0, 0, 512, 320);
                warningCtx.fillStyle = '#ff0000'; warningCtx.font = 'bold 24px sans-serif'; warningCtx.textAlign = 'left'; warningCtx.fillText("⚠ ATTENZIONE: PERICOLO", 40, 60);
                warningCtx.fillStyle = '#ffffff'; warningCtx.font = '18px sans-serif';
                wrapTextCentrato(warningCtx, "Il macchinario è in funzione senza protezioni! Premi immediatamente il TASTO ROSSO di emergenza sulla console per fermarlo.", 40, 110, 432, 26);
            }
            warningTexture.needsUpdate = true;
        }


        // -----------------------------------------------------------------
        // CONFIGURAZIONE SCHEDA INFORMATIVA E NUOVI DPI
        // -----------------------------------------------------------------
        let isInfoPanelOpen = false; let currentHoverObject = null; let currentAttachedObject = null; 

        const ppeDati = [
            { id: "caschetto", url: 'assets/safety/caschetto.glb', pos: new THREE.Vector3(-0.6, 0.8, -1.5), title: "Caschetto di Sicurezza", info: "Protegge il capo da urti accidentali e caduta di materiali. Controlla sempre l'integrità della calotta prima dell'uso." },
            { id: "occhiali", url: 'assets/safety/occhiali.glb', pos: new THREE.Vector3(0, 0.8, -1.5), title: "Occhiali Protettivi", info: "Ripara gli occhi da schegge, polvere e schizzi di liquidi pericolosi. Verifica che le lenti siano intatte e pulite." },
            { id: "guanti", url: 'assets/safety/guanti.glb', pos: new THREE.Vector3(0.6, 0.8, -1.5), title: "Guanti da Lavoro", info: "Garantiscono una presa sicura e proteggono le mani da tagli o abrasioni. Assicurati che non presentino strappi o usura." }
        ];

        const infoCanvas = document.createElement('canvas'); infoCanvas.width = 400; infoCanvas.height = 300;
        const infoCtx = infoCanvas.getContext('2d'); const infoTexture = new THREE.CanvasTexture(infoCanvas);
        const infoPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.45), new THREE.MeshBasicMaterial({ map: infoTexture, side: THREE.DoubleSide }));
        const infoGroup = new THREE.Group(); infoGroup.add(infoPanelMesh); infoGroup.visible = false; 
        camera.add(infoGroup); infoGroup.position.set(0, 0, -0.8);

        function disegnaSchedaMinimalSolida(titolo, descrizione) {
            infoCtx.fillStyle = '#121212'; infoCtx.fillRect(0, 0, 400, 300);
            infoCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; infoCtx.lineWidth = 4; infoCtx.strokeRect(0, 0, 400, 300);
            infoCtx.fillStyle = '#ffffff'; infoCtx.font = '500 22px sans-serif'; infoCtx.textAlign = 'left'; infoCtx.fillText(titolo.toUpperCase(), 30, 50);
            infoCtx.fillStyle = '#aaaaaa'; infoCtx.font = '300 16px sans-serif';
            
            const words = descrizione.split(' '); let line = ''; let y = 95;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (infoCtx.measureText(testLine).width > 340 && n > 0) {
                    infoCtx.fillText(line, 30, y); line = words[n] + ' '; y += 24;
                } else { line = testLine; }
            } infoCtx.fillText(line, 30, y);

            infoCtx.fillStyle = '#666666'; infoCtx.font = 'bold 12px sans-serif'; infoCtx.fillText("PREMI A / X PER CHIUDERE", 30, 265);
            infoTexture.needsUpdate = true; 
        }

        ppeDati.forEach((data) => {
            gltfLoader.load(data.url, (gltf) => {
                const model = gltf.scene; model.position.copy(data.pos);
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.userData.isInteractable = true; child.userData.id = data.id; 
                        child.userData.title = data.title; child.userData.info = data.info;
                        child.userData.isFaseMacchinario = false; 
                        interactables.push(child); 
                    }
                });
                scene.add(model);
            }, null, (error) => { console.error(`Errore caricamento ${data.id}:`, error); });
        });

        // Setup Teletrasporto, Controller & Laser
        const teleportHeight = 0.6; const teleportRadius = 0.25; 
        const teleportGeo = new THREE.CylinderGeometry(teleportRadius, teleportRadius, teleportHeight, 32, 1, true).translate(0, teleportHeight / 2, 0); 
        const teleportMat = new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(0x00d2ff) } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec2 vUv; uniform vec3 uColor; void main() { float alpha = 1.0 - vUv.y; alpha = pow(alpha, 1.5); gl_FragColor = vec4(uColor, alpha); }`,
            transparent: true, side: THREE.DoubleSide, depthWrite: false       
        });
        const teleportMarker = new THREE.Mesh(teleportGeo, teleportMat); teleportMarker.visible = false; scene.add(teleportMarker);

        const controller1 = renderer.xr.getController(0); const controller2 = renderer.xr.getController(1);
        cameraRig.add(controller1); cameraRig.add(controller2);

        const controllerModelFactory = new XRControllerModelFactory();
        const grip1 = renderer.xr.getControllerGrip(0); grip1.add(controllerModelFactory.createControllerModel(grip1)); cameraRig.add(grip1);
        const grip2 = renderer.xr.getControllerGrip(1); grip2.add(controllerModelFactory.createControllerModel(grip2)); cameraRig.add(grip2);

        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
        const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        const line1 = new THREE.Line(laserGeo, laserMat); line1.name = 'line'; line1.scale.z = 10; controller1.add(line1);
        const line2 = new THREE.Line(laserGeo, laserMat.clone()); line2.name = 'line'; line2.scale.z = 10; controller2.add(line2);

        let isTeleportMode = false; let activeTeleportController = null; let teleportPoint = new THREE.Vector3();

        function onTriggerStart(event) { 
            if (isTutorialActive) return; 
            activeTeleportController = event.target; isTeleportMode = true; 
        }

        function onTriggerEnd(event) {
            if (isTutorialActive) return;
            if (isTeleportMode && teleportMarker.visible && activeTeleportController === event.target) {
                cameraRig.position.set(teleportPoint.x, cameraRig.position.y, teleportPoint.z);
            }
            isTeleportMode = false; teleportMarker.visible = false; activeTeleportController = null;
        }
        controller1.addEventListener('selectstart', onTriggerStart); controller1.addEventListener('selectend', onTriggerEnd);
        controller2.addEventListener('selectstart', onTriggerStart); controller2.addEventListener('selectend', onTriggerEnd);


        // -----------------------------------------------------------------
        // LOOP ANIMAZIONE PRINCIPALE
        // -----------------------------------------------------------------
        const raycaster = new THREE.Raycaster();
        const workingMatrix = new THREE.Matrix4();
        const MAX_LASER_RANGE = 10;
        const prevButtonsState = { left: false, right: false }; 
        
        renderer.setAnimationLoop(() => {
            const session = renderer.xr.getSession();
            const time = performance.now() * 0.003; 
            
            if (currentHoverObject && currentHoverObject.material && currentHoverObject.material.emissive) {
                currentHoverObject.material.emissive.setHex(0x000000);
                currentHoverObject = null;
            }

            // TAPPA 1 LOGIC
            if (!isTutorialActive && !stage1Triggered) {
                stageMarkerMat.opacity = 0.3 + Math.sin(time * 2) * 0.4;
                stageTriangle1.position.y = 0.5 + Math.sin(time * 2.5) * 0.06;

                const userPos2D = new THREE.Vector2(cameraRig.position.x, cameraRig.position.z);
                const targetPos2D = new THREE.Vector2(targetStage1.x, targetStage1.z);
                
                if (userPos2D.distanceTo(targetPos2D) < 0.5) {
                    stage1Triggered = true;
                    locationPointerGroup1.visible = false; 
                    disegnaSchedaObiettivo3D();
                    objectiveGroup.visible = true; 
                }
            }

            // TAPPA 2 LOGIC
            if (taskCompleted && !stage2Triggered) {
                locationPointerGroup2.visible = true;
                stageMarkerMat.opacity = 0.3 + Math.sin(time * 2) * 0.4;
                stageTriangle2.position.y = 0.5 + Math.sin(time * 2.5) * 0.06;

                const userPos2D = new THREE.Vector2(cameraRig.position.x, cameraRig.position.z);
                const targetPos2D2 = new THREE.Vector2(targetStage2.x, targetStage2.z);

                if (userPos2D.distanceTo(targetPos2D2) < 0.5) {
                    stage2Triggered = true;
                    locationPointerGroup2.visible = false;
                    objectiveGroup.visible = false; 
                    machObjectiveGroup.visible = true;
                }
            }

            // TAPPA 3 LOGIC (Allarme)
            if (macchinarioTaskCompleted && !stage3Triggered) {
                locationPointerGroup3.visible = true;
                stageMarkerMat.opacity = 0.3 + Math.sin(time * 2) * 0.4;
                stageTriangle3.position.y = 0.5 + Math.sin(time * 2.5) * 0.06;

                const userPos2D = new THREE.Vector2(cameraRig.position.x, cameraRig.position.z);
                const targetPos2D3 = new THREE.Vector2(targetStage3.x, targetStage3.z);

                if (userPos2D.distanceTo(targetPos2D3) < 0.6) {
                    stage3Triggered = true;
                    locationPointerGroup3.visible = false;
                    machObjectiveGroup.visible = false; // Nascondiamo scheda tappa 2
                    
                    // Inizia fase d'emergenza
                    disegnaSchedaWarning();
                    warningGroup.visible = true;
                    
                    // Riproduce il rumore se caricato
                    if (rumoreAudio.buffer && !rumoreAudio.isPlaying) {
                        rumoreAudio.play();
                    }
                }
            }

            if (session) {
                let hoveringThisFrame = false;

                for (const source of session.inputSources) {
                    const controller = source.handedness === 'right' ? controller1 : controller2;
                    const line = controller.getObjectByName('line');
                    line.scale.z = MAX_LASER_RANGE; 

                    workingMatrix.identity().extractRotation(controller.matrixWorld);
                    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(workingMatrix);

                    let currentRayLength = MAX_LASER_RANGE;

                    if (isTutorialActive) {
                        const tutIntersects = raycaster.intersectObject(tutorialMesh);
                        if (tutIntersects.length > 0) {
                            currentRayLength = tutIntersects[0].distance;
                            const uv = tutIntersects[0].uv;
                            if (uv.x >= 0.2 && uv.x <= 0.8 && uv.y >= 0.05 && uv.y <= 0.15) {
                                hoveringThisFrame = true;
                            }
                        }
                        line.scale.z = currentRayLength;
                    } else {
                        const objIntersects = raycaster.intersectObjects(interactables);
                        if (objIntersects.length > 0) {
                            currentHoverObject = objIntersects[0].object; currentRayLength = objIntersects[0].distance; 
                            if (!isTeleportMode && currentHoverObject.material && currentHoverObject.material.emissive) {
                                currentHoverObject.material.emissive.setHex(0x333333); 
                            }
                        }

                        const teleportIntersects = raycaster.intersectObjects(environmentColliders, true);
                        if (teleportIntersects.length > 0) {
                            const hitObj = teleportIntersects[0].object; 
                            const hitDist = teleportIntersects[0].distance;
                            
                            if (isTeleportMode && controller === activeTeleportController) {
                                if (hitObj.name === 'floor') {
                                    currentRayLength = hitDist; 
                                    teleportPoint.copy(teleportIntersects[0].point);
                                    teleportMarker.position.copy(teleportPoint).y = 0.001; 
                                    teleportMarker.visible = true;
                                } else {
                                    currentRayLength = hitDist; 
                                    teleportMarker.visible = false; 
                                }
                            } else if (!objIntersects.length) { 
                                currentRayLength = hitDist; 
                            }
                        } else if (isTeleportMode && controller === activeTeleportController) { 
                            teleportMarker.visible = false; 
                        }

                        line.scale.z = currentRayLength; 
                    }

                    if (source.gamepad) {
                        const buttonPressed = source.gamepad.buttons[4]?.pressed || false; const hand = source.handedness;
                        if (buttonPressed && !prevButtonsState[hand]) {
                            
                            if (isTutorialActive) {
                                if (isHoveringButton) {
                                    tutorialIndex++;
                                    if (tutorialIndex < tutorialSlides.length) {
                                        disegnaTutorialHUD();
                                    } else {
                                        isTutorialActive = false;
                                        tutorialGroup.visible = false;
                                        locationPointerGroup1.visible = true; 
                                    }
                                }
                            } else {
                                if (currentHoverObject) {
                                    const data = currentHoverObject.userData;
                                    
                                    // LOGICA EMERGENZA (TAPPA 3)
                                    if (stage3Triggered && !emergenzaRisolta && data.id === "tasto_emergenza") {
                                        emergenzaRisolta = true;
                                        if (rumoreAudio.isPlaying) {
                                            rumoreAudio.stop();
                                        }
                                        disegnaSchedaWarning(); // Aggiorna la scheda a "Completato"
                                    }
                                    
                                    // Logica standard scheda info
                                    if (isInfoPanelOpen) {
                                        if (currentAttachedObject === currentHoverObject) {
                                            infoGroup.visible = false; isInfoPanelOpen = false; currentAttachedObject = null;
                                        } else {
                                            disegnaSchedaMinimalSolida(data.title, data.info); currentAttachedObject = currentHoverObject;
                                        }
                                    } else {
                                        disegnaSchedaMinimalSolida(data.title, data.info); infoGroup.visible = true; isInfoPanelOpen = true; currentAttachedObject = currentHoverObject;
                                        
                                        // Logica completamento Tappa 1 (DPI)
                                        if (stage1Triggered && !taskCompleted && !data.isFaseMacchinario) {
                                            inspectedObjects.add(data.id);
                                            if (inspectedObjects.size === totalObjectsToInspect) {
                                                taskCompleted = true;
                                                disegnaSchedaObiettivo3D(); 
                                            } else {
                                                disegnaSchedaObiettivo3D(); 
                                            }
                                        }

                                        // Logica completamento Tappa 2 (Macchinario)
                                        if (stage2Triggered && !macchinarioTaskCompleted && data.isFaseMacchinario) {
                                            macchinarioInspectedObjects.add(data.id);
                                            if (macchinarioInspectedObjects.size === totalMacchinarioObjects) {
                                                macchinarioTaskCompleted = true;
                                                disegnaSchedaObiettivoMacchinario3D();
                                            } else {
                                                disegnaSchedaObiettivoMacchinario3D();
                                            }
                                        }
                                    }
                                } else if (isInfoPanelOpen) {
                                    infoGroup.visible = false; isInfoPanelOpen = false; currentAttachedObject = null;
                                }
                            }
                        }
                        prevButtonsState[hand] = buttonPressed; 
                    }
                }

                if (isTutorialActive && hoveringThisFrame !== isHoveringButton) {
                    isHoveringButton = hoveringThisFrame;
                    disegnaTutorialHUD();
                }
            }
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
