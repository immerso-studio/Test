<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corso VR - Formazione Sicurezza</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <script>
    // Corregge la rotazione del modello .GLB delle mani
    AFRAME.registerComponent('fix-rotazione-mani', {
      schema: {
        rotazione: {type: 'vec3', default: {x: 90, y: 180, z: 0}}
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          this.el.setAttribute('rotation', this.data.rotazione);
        });
      }
    });

    // Componente Outline aggiornato per supportare una specifica submesh
    AFRAME.registerComponent('outline', {
      schema: {
        color: {default: '#ffffff'},
        scale: {default: 1.08},
        pulse: {default: false},
        frequency: {default: 1},
        submesh: {type: 'string', default: ''} // Nome della mesh specifica (opzionale)
      },

      init: function () {
        this.outlines = [];
        this.outlineCreated = false;
        this.isGLTF = this.el.hasAttribute('gltf-model');
        this.raycasterEl = null;

        this.outlineUniforms = {
          uThickness: { value: (this.data.scale - 1) * 0.25 }
        };

        const setup = () => {
          if (this.outlineCreated) return;
          if (this.isGLTF && !this.el.getObject3D('mesh')) return;

          this.createOutline();
          this.outlineCreated = true;
        };

        this.el.addEventListener('loaded', setup);
        this.el.addEventListener('model-loaded', setup);
        
        setTimeout(setup, 0);

        this.el.addEventListener('raycaster-intersected', (evt) => {
          if (!this.data.submesh) {
            this.outlines.forEach(mesh => { mesh.visible = true; });
          } else {
            this.raycasterEl = evt.detail.el; // Traccia il controller che interseca
          }
        });
        
        this.el.addEventListener('raycaster-intersected-cleared', () => {
          this.outlines.forEach(mesh => { mesh.visible = false; });
          this.raycasterEl = null;
        });
      },

      createOutline: function () {
        const rootObj = this.el.getObject3D('mesh');
        if (!rootObj) return;

        const material = new THREE.MeshBasicMaterial({
          color: this.data.color,
          side: THREE.BackSide,
          depthTest: false,
          depthWrite: false,
          transparent: true,
          opacity: 1.0,
        });

        if (this.isGLTF) {
          material.onBeforeCompile = (shader) => {
            shader.uniforms.uThickness = this.outlineUniforms.uThickness;
            shader.vertexShader = 'uniform float uThickness;\n' + shader.vertexShader;
            shader.vertexShader = shader.vertexShader.replace(
              '#include <begin_vertex>',
              `
              #include <begin_vertex>
              transformed += normal * uThickness;
              `
            );
          };
        }

        const meshesToOutline = [];
        
        if (rootObj.isMesh) {
          if (!this.data.submesh || rootObj.name === this.data.submesh || rootObj.name === 'Mesh.023') {
            meshesToOutline.push(rootObj);
          }
        } else {
          rootObj.traverse((node) => {
            if (node.isMesh && (!node.userData || !node.userData.isOutline)) {
              if (!this.data.submesh) {
                meshesToOutline.push(node);
              } else {
                // Genera l'outline solo se il nodo corrente o il suo parent corrispondono al target
                let current = node;
                let match = false;
                while (current && current !== rootObj) {
                  if (current.name === this.data.submesh || current.name === 'Mesh.023') {
                    match = true;
                    break;
                  }
                  current = current.parent;
                }
                if (match) meshesToOutline.push(node);
              }
            }
          });
        }

        meshesToOutline.forEach((node) => {
          if (!node.geometry) return;
          
          const geometry = node.geometry.clone();
          const outlineSubMesh = new THREE.Mesh(geometry, material);
          
          if (this.isGLTF) {
            outlineSubMesh.scale.set(1, 1, 1);
          } else {
            outlineSubMesh.scale.setScalar(this.data.scale);
          }
          
          outlineSubMesh.visible = false;
          outlineSubMesh.renderOrder = 999;
          outlineSubMesh.userData.isOutline = true; 
          
          node.add(outlineSubMesh);
          this.outlines.push(outlineSubMesh);
        });
      },

      tick: function (t) {
        // Gestione visibilità dinamica basata sul puntamento di precisione della submesh
        if (this.data.submesh && this.raycasterEl) {
          const raycaster = this.raycasterEl.components.raycaster;
          const intersection = raycaster.getIntersection(this.el);
          if (intersection && intersection.object) {
            let hit = false;
            let obj = intersection.object;
            while (obj) {
              if (obj.name === this.data.submesh || obj.name === 'Mesh.023') {
                hit = true;
                break;
              }
              obj = obj.parent;
            }
            this.outlines.forEach(mesh => { mesh.visible = hit; });
          } else {
            this.outlines.forEach(mesh => { mesh.visible = false; });
          }
        }

        if (!this.data.pulse || this.outlines.length === 0) return;

        if (this.isGLTF) {
          const baseThickness = (this.data.scale - 1) * 0.25;
          this.outlineUniforms.uThickness.value = baseThickness + 0.004 * Math.sin(this.data.frequency * t / 120);
        } else {
          const s = this.data.scale + 0.02 * Math.sin(this.data.frequency * t / 120);
          this.outlines.forEach(mesh => {
            mesh.scale.setScalar(s);
          });
        }
      }
    });

    // Componente per sincronizzare teleport e laser
    AFRAME.registerComponent('sync-teleport-laser', {
      init: function () {
        this.synced = false;
        this.el.addEventListener('loaded', () => { this.setupSync(); });
        setTimeout(() => { if (!this.synced) this.setupSync(); }, 1000);
      },
      setupSync: function () {
        const blinkControls = this.el.components['blink-controls'];
        const raycaster = this.el.components['raycaster'];
        if (!blinkControls || !raycaster) return;
        blinkControls.data.curveTint = '#ffffff';
        blinkControls.data.curveOpacity = 0.8;
        if (blinkControls.raycaster && raycaster.raycaster) {
          Object.defineProperty(blinkControls, 'raycaster', {
            get: function() { return raycaster.raycaster; },
            configurable: true
          });
        }
        this.synced = true;
      },
      tick: function () {
        const blinkControls = this.el.components['blink-controls'];
        const raycaster = this.el.components['raycaster'];
        if (!blinkControls || !raycaster) return;
        if (blinkControls.curveMaterial) {
          blinkControls.curveMaterial.color.set('#ffffff');
          blinkControls.curveMaterial.opacity = 0.8;
        }
        if (raycaster.line) {
          if (blinkControls.isTeleporting) {
            raycaster.line.visible = false;
          } else if (raycaster.data.showLine) {
            raycaster.line.visible = true;
          }
        }
      }
    });

    // Sistema globale per gestire le schede informative
    AFRAME.registerSystem('info-card-system', {
      init: function () {
        this.activeCard = null;
        this.cardData = null;
        this.isCardOpen = false;
      },
      createCard: function (data) {
        this.hideCard();
        const camera = document.querySelector('#camera');
        if (!camera) return;

        const card = document.createElement('a-entity');
        card.setAttribute('id', 'info-card-follow');
        card.setAttribute('position', '0 -0.15 -1');
        card.setAttribute('animation', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 400; easing: easeOutElastic');
        
        card.innerHTML = `
          <a-plane position="0 0 0" width="0.8" height="0.45" material="shader: flat; color: #22222b; opacity: 0.95; transparent: true;"></a-plane>
          <a-text position="-0.34 0.14 0.002" value="${data.title || 'Informazioni'}" align="left" color="#ffffff" width="0.7"></a-text>
          <a-text position="-0.34 0.04 0.002" value="${data.description || 'Nessuna descrizione disponibile'}" align="left" baseline="top" color="#dcdcdc" width="0.70" wrap-count="40"></a-text>
          <a-circle id="close-button-container" position="0.34 0.14 0.003" class="close-interactive" radius="0.038" material="shader: flat; color: #ff0000;"
                    animation__hoverin="property: scale; to: 1.2 1.2 1.2; dur: 150; startEvents: mouseenter"
                    animation__hoverout="property: scale; to: 1 1 1; dur: 150; startEvents: mouseleave"
                    animation__colorin="property: material.color; to: #ff3333; dur: 150; startEvents: mouseenter"
                    animation__colorout="property: material.color; to: #ff0000; dur: 150; startEvents: mouseleave">
            <a-text value="X" align="center" color="#ffffff" width="0.3" wrap-count="10" position="0 0 0"></a-text>
          </a-circle>
        `;
        
        camera.appendChild(card);
        this.activeCard = card;
        this.cardData = data;
        this.isCardOpen = true;

        this.disableTeleport();
        this.updateControllerRaycasters(true);
        setTimeout(() => { this.setupCloseButtonListeners(); }, 100);
      },
      setupCloseButtonListeners: function () {
        const closeButton = document.querySelector('#close-button-container');
        if (closeButton) { closeButton.addEventListener('click', () => { this.animateAndHide(); }); }
      },
      animateAndHide: function () {
        if (this.activeCard) {
          this.activeCard.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 200; easing: easeInBack');
          setTimeout(() => this.hideCard(), 200);
        }
      },
      updateControllerRaycasters: function (cardOpen) {
        const leftHand = document.querySelector('#leftHand');
        const rightHand = document.querySelector('#rightHand');
        if (leftHand && leftHand.components['raycaster']) { leftHand.setAttribute('raycaster', 'objects', cardOpen ? '.close-interactive' : '.interattivo'); }
        if (rightHand && rightHand.components['raycaster']) { rightHand.setAttribute('raycaster', 'objects', cardOpen ? '.close-interactive' : '.interattivo'); }
      },
      disableTeleport: function () {
        const leftHand = document.querySelector('#leftHand');
        const rightHand = document.querySelector('#rightHand');
        if (leftHand && leftHand.components['blink-controls']) leftHand.setAttribute('blink-controls', 'enabled', false);
        if (rightHand && rightHand.components['blink-controls']) rightHand.setAttribute('blink-controls', 'enabled', false);
      },
      enableTeleport: function () {
        const leftHand = document.querySelector('#leftHand');
        const rightHand = document.querySelector('#rightHand');
        if (leftHand && leftHand.components['blink-controls']) leftHand.setAttribute('blink-controls', 'enabled', true);
        if (rightHand && rightHand.components['blink-controls']) rightHand.setAttribute('blink-controls', 'enabled', true);
      },
      hideCard: function () {
        if (this.activeCard && this.activeCard.parentNode) { this.activeCard.parentNode.removeChild(this.activeCard); }
        this.activeCard = null;
        this.cardData = null;
        this.isCardOpen = false;
        this.enableTeleport();
        this.updateControllerRaycasters(false);
      },
      isCardVisible: function () { return this.isCardOpen; }
    });

    // Componente Info-Card aggiornato per gestire il clic filtrato sulla submesh
    AFRAME.registerComponent('info-card-trigger', {
      schema: {
        title: {type: 'string', default: 'Informazioni'},
        description: {type: 'string', default: 'Descrizione dettagliata dell\'oggetto selezionato.'},
        submesh: {type: 'string', default: ''} // Nome della mesh specifica (opzionale)
      },
      init: function () {
        this.system = document.querySelector('a-scene').systems['info-card-system'];
        this.raycasterEl = null;

        this.el.addEventListener('raycaster-intersected', (evt) => { 
          if (!this.data.submesh) {
            this.intersected = true; 
          } else {
            this.raycasterEl = evt.detail.el;
          }
        });
        
        this.el.addEventListener('raycaster-intersected-cleared', () => { 
          this.intersected = false; 
          this.raycasterEl = null;
        });
      },
      tick: function () {
        if (this.data.submesh && this.raycasterEl) {
          const raycaster = this.raycasterEl.components.raycaster;
          const intersection = raycaster.getIntersection(this.el);
          if (intersection && intersection.object) {
            let hit = false;
            let obj = intersection.object;
            while (obj) {
              if (obj.name === this.data.submesh || obj.name === 'Mesh.023') {
                hit = true;
                break;
              }
              obj = obj.parent;
            }
            this.intersected = hit;
          } else {
            this.intersected = false;
          }
        }
      },
      openCard: function () {
        if (this.intersected && this.system && !this.system.isCardVisible()) {
          this.system.createCard({ title: this.data.title, description: this.data.description });
        }
      }
    });

    // Componente per gestire gli input dei controller
    AFRAME.registerComponent('controller-input', {
      init: function () {
        this.system = document.querySelector('a-scene').systems['info-card-system'];
        this.el.addEventListener('xbuttondown', () => { this.handleInput(); });
        this.el.addEventListener('abuttondown', () => { this.handleInput(); });
        this.el.addEventListener('click', () => { this.handleInput(); });
      },
      handleInput: function () {
        if (this.system.isCardVisible()) {
          this.system.animateAndHide();
          return;
        }
        const intersectedObjects = document.querySelectorAll('.interattivo');
        let activeObject = null;
        intersectedObjects.forEach(obj => {
          if (obj.components['info-card-trigger'] && obj.components['info-card-trigger'].intersected) { activeObject = obj; }
        });
        if (activeObject) { activeObject.components['info-card-trigger'].openCard(); }
      }
    });
  </script>

  <style>
    .instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 1000;
      text-align: center;
      line-height: 1.6;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <a-scene environment="preset: default; groundColor: #445; grid: cross" cursor="rayOrigin: mouse">
    
    <a-assets>
      <a-asset-item id="glb-mano" src="assets/mano_virtuale.glb"></a-asset-item>
      <a-asset-item id="glb-macchinario" src="assets/macchinario.glb"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0"></a-camera>

      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .interattivo; far: 10; showLine: true; lineColor: #ffffff; lineOpacity: 0.8" line="color: #ffffff; opacity: 0.8" blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #ffffff; curveOpacity: 0.8; curveStyle: straight; rotateOnTeleport: false" sync-teleport-laser controller-input>
        <a-entity gltf-model="#glb-mano" fix-rotazione-mani="rotazione: 90 180 0"></a-entity>
      </a-entity>

      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .interattivo; far: 10; showLine: true; lineColor: #ffffff; lineOpacity: 0.8" line="color: #ffffff; opacity: 0.8" blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #ffffff; curveOpacity: 0.8; curveStyle: straight; rotateOnTeleport: false" sync-teleport-laser controller-input>
        <a-entity gltf-model="#glb-mano" fix-rotazione-mani="rotazione: 90 0 0"></a-entity>
      </a-entity>
    </a-entity>

    <a-plane class="navigabile" rotation="-90 0 0" width="30" height="30" material="opacity: 0; transparent: true"></a-plane>

    <a-box id="box-sicurezza" position="-2 1.2 -3" color="#4cc9f0" class="interattivo" outline="color: #ffffff; scale: 1.08; pulse: false;" info-card-trigger="title: Box Sicurezza; description: Questo box rappresenta un modulo di sicurezza base. Contiene informazioni essenziali per la protezione sul lavoro e le normative vigenti ambientali."></a-box>

    <a-entity 
      id="macchinario-sicurezza"
      gltf-model="#glb-macchinario"
      position="1 0 -5" 
      rotation="0 -90 0"
      scale="0.07 0.07 0.07"
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false; submesh: Tasto_cliccabile;"
      info-card-trigger="title: Pulsante Macchinario; description: Hai attivato con successo il tasto cliccabile del macchinario industriale. Questa procedura simula la messa in sicurezza dell'impianto in ambiente VR.; submesh: Tasto_cliccabile;">
    </a-entity>

    <a-cone id="cone-sicurezza" position="2 1.2 -3" color="#7209b7" class="interattivo" outline="color: #ffffff; scale: 1.08; pulse: false;" info-card-trigger="title: Cono Segnaletico; description: Rappresenta un punto di interesse per la segnaletica di sicurezza. Importante per la prevenzione di incidenti e la corretta delimitazione delle zone di pericolo."></a-cone>

  </a-scene>

  <div class="instructions">
    🖐️ Entrambe le mani: Trigger per Teletrasporto<br>
    📄 Tasto X (sinistra) o A (destra) / Click Mouse: APRI scheda<br>
    ✕ Tasto X (sinistra) o A (destra) / Puntamento pulsante rosso: CHIUDI scheda<br>
    🔒 Durante la lettura il teletrasporto viene temporaneamente bloccato
  </div>

</body>
</html>
