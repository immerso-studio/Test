<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training VR Industriale - InfoCard Avanzate</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // -----------------------------------------------------------------
        // CONFIGURAZIONE AMBIENTE E CAMERA RIG (Setup VR Standard)
        // -----------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.06);

        // Rig fondamentale per muovere l'utente
        const cameraRig = new THREE.Group();
        cameraRig.position.set(0, 0, 2); // Utente spawna a Z=2
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        cameraRig.add(camera);
        scene.add(cameraRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // Abilita il WebXR
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // Luci soffuse e pulite
        scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(3, 10, 3);
        scene.add(dirLight);

        // Pavimento minimal e griglia geometrica
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.name = 'floor';
        scene.add(floor);

        const grid = new THREE.GridHelper(40, 40, 0x333333, 0x222222);
        grid.position.y = 0.001;
        scene.add(grid);

        // Banco da lavoro DPI
        const table = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x2b2b2b })
        );
        table.position.set(0, 0.4, -1.5);
        scene.add(table);

        const interactables = [];

        // -----------------------------------------------------------------
        // CONFIGURAZIONE DATI E SCHEDA INFORMATIVA SOLIDA (Canvas)
        // -----------------------------------------------------------------
        let isInfoPanelOpen = false;
        let currentHoverObject = null;
        let currentAttachedObject = null; 

        // Dati dei PPE realistici
        const ppeDati = [
            { 
                url: 'assets/safety/casco.glb', 
                pos: new THREE.Vector3(-0.6, 0.8, -1.5), 
                title: "Casco di Sicurezza", 
                info: "Protegge il capo da urti accidentali e dalla caduta dall'alto di materiali. Ispeziona regolarmente per crepe." 
            },
            { 
                url: 'assets/safety/imbragatura.glb', 
                pos: new THREE.Vector3(0, 0.92, -1.5), 
                title: "Imbragatura Anticaduta", 
                info: "Dispositivo salvavita obbligatorio per lavori operativi oltre i 2 metri d'altezza. Controlla i punti di aggancio." 
            },
            { 
                url: 'assets/safety/scarpe.glb', 
                pos: new THREE.Vector3(0.6, 0.85, -1.5), 
                title: "Scarpe Tecniche", 
                info: "Puntale rinforzato in acciaio contro schiacciamenti accidentali accidentali e suola antiscivolo. Obbligatorie in cantiere." 
            }
        ];

        // Creazione della scheda informativa singola
        const infoCanvas = document.createElement('canvas'); infoCanvas.width = 512; infoCanvas.height = 256;
        const infoCtx = infoCanvas.getContext('2d');
        const infoTexture = new THREE.CanvasTexture(infoCanvas);
        
        const infoPanelGeo = new THREE.PlaneGeometry(0.9, 0.45);
        const infoPanelMat = new THREE.MeshBasicMaterial({ map: infoTexture, side: THREE.DoubleSide, transparent: false });
        const infoPanelMesh = new THREE.Mesh(infoPanelGeo, infoPanelMat);
        
        const infoGroup = new THREE.Group(); 
        infoGroup.add(infoPanelMesh); 
        infoGroup.visible = false; 
        
        // MODIFICA ABILITÀ HUD: Agganciamo il gruppo direttamente alla camera, non alla scena
        camera.add(infoGroup); 
        
        // Posizioniamo la scheda esattamente davanti agli occhi dell'utente (X=0, Y=0, Z=-0.8 metri)
        infoGroup.position.set(0, 0, -0.8);

        // Helper per il wrapping del testo sul Canvas
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight;
                } else { line = testLine; }
            }
            ctx.fillText(line, x, y);
        }

        function disegnaSchedaMinimalSolida(titolo, descrizione) {
            infoCtx.fillStyle = '#121212'; infoCtx.fillRect(0, 0, 512, 256);
            infoCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; infoCtx.lineWidth = 4; infoCtx.strokeRect(0, 0, 512, 256);
            infoCtx.fillStyle = '#ffffff'; infoCtx.font = '500 24px sans-serif'; infoCtx.fillText(titolo.toUpperCase(), 40, 60);
            infoCtx.fillStyle = '#aaaaaa'; infoCtx.font = '300 17px sans-serif';
            wrapText(infoCtx, descrizione, 40, 110, 432, 26);
            infoCtx.fillStyle = '#666666'; infoCtx.font = 'bold 12px sans-serif'; infoCtx.fillText("PREMI A / X PER CHIUDERE", 40, 225);
            infoTexture.needsUpdate = true; 
        }

        // -----------------------------------------------------------------
        // CARICAMENTO ASSET FOTOREALISTICI (.GLB)
        // -----------------------------------------------------------------
        const gltfLoader = new GLTFLoader();

        ppeDati.forEach((data) => {
            gltfLoader.load(
                data.url,
                (gltf) => {
                    const model = gltf.scene;
                    model.position.copy(data.pos);
                    
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.userData.isInteractable = true; 
                            child.userData.title = data.title; 
                            child.userData.info = data.info;
                            interactables.push(child); 
                        }
                    });

                    scene.add(model);
                },
                null,
                (error) => { console.error('Errore nel caricamento del GLB:', error); }
            );
        });

        // -----------------------------------------------------------------
        // PUNTATORE LASER BIANCO E TELETRASPORTO VISUALE (MARKER)
        // -----------------------------------------------------------------
        const teleportMarker = new THREE.Mesh(
            new THREE.RingGeometry(0.22, 0.25, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
        );
        teleportMarker.visible = false;
        scene.add(teleportMarker);

        const controller1 = renderer.xr.getController(0);
        const controller2 = renderer.xr.getController(1);
        cameraRig.add(controller1); cameraRig.add(controller2);

        const controllerModelFactory = new XRControllerModelFactory();
        const grip1 = renderer.xr.getControllerGrip(0); grip1.add(controllerModelFactory.createControllerModel(grip1)); cameraRig.add(grip1);
        const grip2 = renderer.xr.getControllerGrip(1); grip2.add(controllerModelFactory.createControllerModel(grip2)); cameraRig.add(grip2);

        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
        const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        const line1 = new THREE.Line(laserGeo, laserMat); line1.name = 'line'; line1.scale.z = 10; controller1.add(line1);
        const line2 = new THREE.Line(laserGeo, laserMat.clone()); line2.name = 'line'; line2.scale.z = 10; controller2.add(line2);


        // -----------------------------------------------------------------
        // GESTIONE INPUT (TRIGGER -> TELETRASPORTO)
        // -----------------------------------------------------------------
        let isTeleportMode = false;
        let activeTeleportController = null;
        let teleportPoint = new THREE.Vector3();

        function onTriggerStart(event) { activeTeleportController = event.target; isTeleportMode = true; }

        function onTriggerEnd(event) {
            if (isTeleportMode && teleportMarker.visible && activeTeleportController === event.target) {
                cameraRig.position.set(teleportPoint.x, cameraRig.position.y, teleportPoint.z);
            }
            isTeleportMode = false; teleportMarker.visible = false; activeTeleportController = null;
        }

        controller1.addEventListener('selectstart', onTriggerStart); controller1.addEventListener('selectend', onTriggerEnd);
        controller2.addEventListener('selectstart', onTriggerStart); controller2.addEventListener('selectend', onTriggerEnd);


        // -----------------------------------------------------------------
        // LOOP ANIMAZIONE PRINCIPALE & LOGICA DEI FRAME
        // -----------------------------------------------------------------
        const raycaster = new THREE.Raycaster();
        const workingMatrix = new THREE.Matrix4();
        const MAX_LASER_RANGE = 10;
        const prevButtonsState = { left: false, right: false }; 
        
        renderer.setAnimationLoop(() => {
            const session = renderer.xr.getSession();
            
            if (currentHoverObject && currentHoverObject.material && currentHoverObject.material.emissive) {
                currentHoverObject.material.emissive.setHex(0x000000);
                currentHoverObject = null;
            }

            if (session) {
                for (const source of session.inputSources) {
                    const controller = source.handedness === 'right' ? controller1 : controller2;
                    const line = controller.getObjectByName('line');
                    line.scale.z = MAX_LASER_RANGE; 

                    workingMatrix.identity().extractRotation(controller.matrixWorld);
                    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(workingMatrix);

                    let currentRayLength = MAX_LASER_RANGE;

                    const objIntersects = raycaster.intersectObjects(interactables);
                    if (objIntersects.length > 0) {
                        currentHoverObject = objIntersects[0].object;
                        currentRayLength = objIntersects[0].distance; 
                        
                        if (!isTeleportMode && currentHoverObject.material && currentHoverObject.material.emissive) {
                            currentHoverObject.material.emissive.setHex(0x222222);
                        }
                    }

                    const floorIntersects = raycaster.intersectObject(floor);
                    if (floorIntersects.length > 0) {
                        const floorDist = floorIntersects[0].distance;
                        
                        if (isTeleportMode && controller === activeTeleportController) {
                            currentRayLength = floorDist; 
                            teleportPoint.copy(floorIntersects[0].point);
                            teleportMarker.position.copy(teleportPoint);
                            teleportMarker.position.y = 0.005;
                            teleportMarker.visible = true;
                        } else if (!objIntersects.length) {
                            currentRayLength = floorDist;
                        }
                    } else if (isTeleportMode && controller === activeTeleportController) {
                        teleportMarker.visible = false;
                    }

                    line.scale.z = currentRayLength; 


                    // --- GESTIONE INFO-CARD (TASTI A / X) ---
                    if (source.gamepad) {
                        const buttonPressed = source.gamepad.buttons[4]?.pressed || false; 
                        const hand = source.handedness;

                        if (buttonPressed && !prevButtonsState[hand]) {
                            
                            if (currentHoverObject) {
                                const data = currentHoverObject.userData;

                                if (isInfoPanelOpen) {
                                    if (currentAttachedObject === currentHoverObject) {
                                        // CASO 1: Cliccato lo stesso oggetto -> CHIUDI scheda
                                        infoGroup.visible = false;
                                        isInfoPanelOpen = false;
                                        currentAttachedObject = null;
                                    } else {
                                        // CASO 2: Cliccato un NUOVO oggetto mentre un'altra scheda è aperta
                                        disegnaSchedaMinimalSolida(data.title, data.info);
                                        
                                        // RIMOZIONE VECCHI CALCOLI POSIZIONE: 
                                        // Avendo agganciato l'infoGroup alla camera, non serve più impostare 
                                        // coordinate spaziali relative all'asset o richiamare lookAt().
                                        
                                        currentAttachedObject = currentHoverObject;
                                    }
                                } else {
                                    // CASO 3: Nessuna scheda aperta -> APRI nuova scheda centrale
                                    disegnaSchedaMinimalSolida(data.title, data.info);

                                    // RIMOZIONE VECCHI CALCOLI POSIZIONE:
                                    // La scheda compare istantaneamente fissa al centro della vista.
                                    
                                    infoGroup.visible = true;
                                    isInfoPanelOpen = true;
                                    currentAttachedObject = currentHoverObject;
                                }
                            } else if (isInfoPanelOpen) {
                                // AZIONE: Cliccato A/X sul vuoto mentre una scheda è aperta -> CHIUDI scheda
                                infoGroup.visible = false;
                                isInfoPanelOpen = false;
                                currentAttachedObject = null;
                            }
                        }
                        prevButtonsState[hand] = buttonPressed; 
                    }
                }
            }
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
