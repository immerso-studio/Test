<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training VR Industriale - Nuovi DPI, Macchinario ed Emergenza</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // -----------------------------------------------------------------
        // PRELOAD INTER TIGHT FONT
        // -----------------------------------------------------------------
        const fontFace = new FontFace('Inter Tight', 'url(https://fonts.gstatic.com/s/intertight/v7/NGSnv5HMAFg6IuGlBNMjxJEL2VmU3NS7Z2mjDw-qXCRToK8EPg.woff2)');
        let fontReady = false;
        fontFace.load().then((loaded) => {
            document.fonts.add(loaded);
            fontReady = true;
            disegnaSchedaObiettivoDPI();
            disegnaSchedaObiettivoMacchinario();
            disegnaSchedaEmergenza();
        }).catch(() => {
            fontReady = true;
            disegnaSchedaObiettivoDPI();
            disegnaSchedaObiettivoMacchinario();
            disegnaSchedaEmergenza();
        });

        // -----------------------------------------------------------------
        // CONFIGURAZIONE AMBIENTE E CAMERA RIG
        // -----------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.06);

        const cameraRig = new THREE.Group();
        cameraRig.position.set(0, 0, 2);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        cameraRig.add(camera);
        scene.add(cameraRig);

        // -----------------------------------------------------------------
        // CONFIGURAZIONE AUDIO
        // -----------------------------------------------------------------
        const audioListener = new THREE.AudioListener();
        camera.add(audioListener);

        const rumoreAudio = new THREE.Audio(audioListener);
        const audioLoader = new THREE.AudioLoader();
        audioLoader.load('assets/audio/rumore.mp3', (buffer) => {
            rumoreAudio.setBuffer(buffer);
            rumoreAudio.setLoop(true);
            rumoreAudio.setVolume(0.5);
        }, undefined, (err) => console.warn("Audio rumore.mp3 non trovato."));

        // Suono di selezione
        const selectAudio = new THREE.Audio(audioListener);
        audioLoader.load('assets/audio/select.mp3', (buffer) => {
            selectAudio.setBuffer(buffer);
            selectAudio.setLoop(false);
            selectAudio.setVolume(0.8);
        }, undefined, (err) => console.warn("Audio select.mp3 non trovato."));

        function playSelectSound() {
            if (selectAudio.buffer && !selectAudio.isPlaying) {
                selectAudio.stop();
                selectAudio.play();
            }
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(3, 10, 3);
        scene.add(dirLight);

        // Pavimento
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.name = 'floor';
        scene.add(floor);

        const grid = new THREE.GridHelper(40, 40, 0x333333, 0x222222);
        grid.position.y = 0.001;
        scene.add(grid);

        // Banco da lavoro
        const table = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x2b2b2b })
        );
        table.position.set(0, 0.4, -1.5);
        table.name = 'table';
        scene.add(table);

        const interactables = [];
        const environmentColliders = [floor, table];

        // -----------------------------------------------------------------
        // CARICAMENTO MACCHINARIO E OSTACOLO FISICO
        // -----------------------------------------------------------------
        const gltfLoader = new GLTFLoader();

        const componentiMacchinario = {
            "Cabina_di_controllo_metallo": { id: "cabina", title: "Cabina di Controllo", info: "Pannello principale per la gestione della macchina. Verificare che non vi siano spie d'allarme attive." },
            "Tasto_rosso": { id: "tasto_emergenza", title: "Pulsante di Emergenza", info: "Blocca istantaneamente l'alimentazione in caso di pericolo. Assicurati che sia ben visibile e non ostruito." }
        };

        gltfLoader.load('assets/macchinario.glb', (gltf) => {
            const machineModel = gltf.scene;
            machineModel.position.set(-1, 0, -3.5);
            machineModel.name = 'macchinario';
            scene.add(machineModel);
            environmentColliders.push(machineModel);

            machineModel.traverse((child) => {
                if (child.isMesh && componentiMacchinario[child.name]) {
                    const datiComponente = componentiMacchinario[child.name];
                    child.userData.isInteractable = true;
                    child.userData.id = datiComponente.id;
                    child.userData.title = datiComponente.title;
                    child.userData.info = datiComponente.info;
                    child.userData.isFaseMacchinario = true;
                    interactables.push(child);
                }
            });
        }, undefined, (error) => { console.warn("Modello macchinario non trovato, procedo senza:", error); });

        // -----------------------------------------------------------------
        // CONFIGURAZIONE DI STATO E DATI DEL TUTORIAL
        // -----------------------------------------------------------------
        let isTutorialActive = true;
        let tutorialIndex = 0;
        let isHoveringButton = false;

        const tutorialSlides = [
            { title: "1. INDICATORE VR", text: "Questo cerchio azzurro mostra la tua prossima destinazione operativa o i punti di interesse attivi nell'area di addestramento.", imgSrc: "assets/tutorial/1.webp", imgObj: null },
            { title: "2. INTERAZIONE OGGETTI", text: "Punta un oggetto con il raggio laser e premi i tasti 'A' (Controller Destro) o 'X' (Controller Sinistro) per selezionarlo e registrare la tua ispezione.", imgSrc: "assets/tutorial/2.webp", imgObj: null },
            { title: "3. TELETRASPORTO DI MOVIMENTO", text: "Tieni premuto il Trigger (Grilletto posteriore) per proiettare il raggio di spostamento azzurro. Rilascialo per teletrasportarti nel punto mirato.", imgSrc: "assets/tutorial/3.webp", imgObj: null }
        ];

        const tutorialCanvas = document.createElement('canvas'); tutorialCanvas.width = 512; tutorialCanvas.height = 512;
        const tutCtx = tutorialCanvas.getContext('2d');
        const tutorialTexture = new THREE.CanvasTexture(tutorialCanvas);

        const tutorialMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(0.5, 0.5),
            new THREE.MeshBasicMaterial({ map: tutorialTexture, side: THREE.DoubleSide, transparent: true })
        );
        const tutorialGroup = new THREE.Group();
        tutorialGroup.add(tutorialMesh);
        camera.add(tutorialGroup);
        tutorialGroup.position.set(0, 0, -0.65);

        function wrapTextCentrato(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' '); let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight;
                } else { line = testLine; }
            } ctx.fillText(line, x, y);
        }

        function disegnaTutorialHUD() {
            if (tutorialIndex >= tutorialSlides.length) return;
            const slide = tutorialSlides[tutorialIndex];

            tutCtx.clearRect(0, 0, 512, 512);
            tutCtx.fillStyle = 'rgba(20, 20, 20, 0.98)'; tutCtx.fillRect(0, 0, 512, 512);
            tutCtx.strokeStyle = 'rgba(0, 210, 255, 0.4)'; tutCtx.lineWidth = 6; tutCtx.strokeRect(0, 0, 512, 512);

            tutCtx.fillStyle = '#ffffff'; tutCtx.font = 'bold 24px sans-serif'; tutCtx.textAlign = 'center';
            tutCtx.fillText(slide.title, 256, 55);

            if (slide.imgObj) {
                const imgSize = 180;
                tutCtx.drawImage(slide.imgObj, 256 - imgSize / 2, 95, imgSize, imgSize);
            }

            tutCtx.fillStyle = '#cccccc'; tutCtx.font = '16px sans-serif'; tutCtx.textAlign = 'center';
            wrapTextCentrato(tutCtx, slide.text, 256, 315, 420, 24);

            tutCtx.fillStyle = isHoveringButton ? '#00bcff' : '#0055ff';
            tutCtx.fillRect(102, 435, 308, 51);

            tutCtx.fillStyle = '#ffffff'; tutCtx.font = 'bold 18px sans-serif';
            tutCtx.fillText(tutorialIndex === tutorialSlides.length - 1 ? "INIZIA TRAINING" : "PROSEGUI (A / X)", 256, 467);

            tutorialTexture.needsUpdate = true;
        }

        let loadedImagesCount = 0;
        tutorialSlides.forEach((slide) => {
            const img = new Image(); img.src = slide.imgSrc;
            img.onload = () => {
                slide.imgObj = img; loadedImagesCount++;
                if (loadedImagesCount === tutorialSlides.length) disegnaTutorialHUD();
            };
        });

        // -----------------------------------------------------------------
        // CONFIGURAZIONE LOCATION POINTERS
        // -----------------------------------------------------------------
        const stageMarkerMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const coneGeo = new THREE.ConeGeometry(0.08, 0.2, 4).rotateX(Math.PI);

        // TAPPA 1: Banco da lavoro
        const targetStage1 = new THREE.Vector3(0, 0.01, -0.6);
        let stage1Triggered = false;
        const locationPointerGroup1 = new THREE.Group();
        locationPointerGroup1.position.copy(targetStage1);
        locationPointerGroup1.visible = false;
        scene.add(locationPointerGroup1);

        const stageMarker1 = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.35, 32).rotateX(-Math.PI / 2), stageMarkerMat);
        const stageTriangle1 = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({ color: 0x00d2ff }));
        stageTriangle1.position.y = 0.5;
        locationPointerGroup1.add(stageMarker1); locationPointerGroup1.add(stageTriangle1);

        // TAPPA 2: Macchinario
        const targetStage2 = new THREE.Vector3(3.30, 0.01, -3.30);
        let stage2Triggered = false;
        const locationPointerGroup2 = new THREE.Group();
        locationPointerGroup2.position.copy(targetStage2);
        locationPointerGroup2.visible = false;
        scene.add(locationPointerGroup2);

        const stageMarker2 = stageMarker1.clone();
        const stageTriangle2 = stageTriangle1.clone();
        locationPointerGroup2.add(stageMarker2); locationPointerGroup2.add(stageTriangle2);

        // TAPPA 3: Allarme Emergenza Macchinario
        const targetStage3 = new THREE.Vector3(3, 0.01, -5);
        let stage3Triggered = false;
        let emergenzaRisolta = false;
        const locationPointerGroup3 = new THREE.Group();
        locationPointerGroup3.position.copy(targetStage3);
        locationPointerGroup3.visible = false;
        scene.add(locationPointerGroup3);

        const stageMarker3 = stageMarker1.clone();
        const stageTriangle3 = stageTriangle1.clone();
        locationPointerGroup3.add(stageMarker3); locationPointerGroup3.add(stageTriangle3);

        // Variabili Logica DPI (Fase 1)
        const inspectedObjects = new Set();
        const totalObjectsToInspect = 3;
        let taskCompleted = false;

        // Variabili Logica Macchinario (Fase 2)
        const macchinarioInspectedObjects = new Set();
        const totalMacchinarioObjects = 2;
        let macchinarioTaskCompleted = false;

        // Dati DPI per la scheda
        const ppeDati = [
            { id: "caschetto", url: 'assets/safety/caschetto.glb', pos: new THREE.Vector3(-0.6, 0.8, -1.5), title: "Caschetto di Sicurezza", info: "Protegge il capo da urti accidentali e caduta di materiali. Controlla sempre l'integrità della calotta prima dell'uso.", imgSrc: 'assets/safety/img/1.webp', imgObj: null },
            { id: "occhiali", url: 'assets/safety/occhiali.glb', pos: new THREE.Vector3(0, 0.8, -1.5), title: "Occhiali Protettivi", info: "Ripara gli occhi da schegge, polvere e schizzi di liquidi pericolosi. Verifica che le lenti siano intatte e pulite.", imgSrc: 'assets/safety/img/2.webp', imgObj: null },
            { id: "guanti", url: 'assets/safety/guanti.glb', pos: new THREE.Vector3(0.6, 0.8, -1.5), title: "Guanti da Lavoro", info: "Garantiscono una presa sicura e proteggono le mani da tagli o abrasioni. Assicurati che non presentino strappi o usura.", imgSrc: 'assets/safety/img/3.webp', imgObj: null }
        ];

        // Caricamento immagini DPI
        ppeDati.forEach(dpi => {
            const img = new Image();
            img.src = dpi.imgSrc;
            img.onload = () => {
                dpi.imgObj = img;
                disegnaSchedaObiettivoDPI();
            };
            img.onerror = () => console.warn(`Immagine DPI non trovata: ${dpi.imgSrc}`);
        });

        // Dati per le card del macchinario
        const macchinarioCardsData = [
            { id: "cabina", title: "Cabina di Controllo", info: "Pannello principale per la gestione della macchina. Verificare che non vi siano spie d'allarme attive.", icon: '⚙️' },
            { id: "tasto_emergenza", title: "Pulsante di Emergenza", info: "Blocca istantaneamente l'alimentazione in caso di pericolo. Assicurati che sia ben visibile e non ostruito.", icon: '🔴' }
        ];

        // -----------------------------------------------------------------
        // SCHEDA OBIETTIVO DPI (Fase 1) — Grande pannello
        // -----------------------------------------------------------------
        const DPI_CANVAS_W = 1024;
        const DPI_CANVAS_H = 680;
        const objCanvas = document.createElement('canvas');
        objCanvas.width = DPI_CANVAS_W;
        objCanvas.height = DPI_CANVAS_H;
        const objCtx = objCanvas.getContext('2d');
        const objTexture = new THREE.CanvasTexture(objCanvas);

        const objPanelMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.5, 1.0),
            new THREE.MeshBasicMaterial({ map: objTexture, side: THREE.DoubleSide, transparent: true })
        );
        const objectiveGroup = new THREE.Group();
        objectiveGroup.add(objPanelMesh);
        scene.add(objectiveGroup);
        objectiveGroup.position.set(0, 1.6, -2.1);
        objectiveGroup.visible = false;

        // -----------------------------------------------------------------
        // SCHEDA OBIETTIVO MACCHINARIO (Fase 2) — Stesso stile grande
        // -----------------------------------------------------------------
        const machCanvas = document.createElement('canvas');
        machCanvas.width = DPI_CANVAS_W;
        machCanvas.height = DPI_CANVAS_H;
        const machCtx = machCanvas.getContext('2d');
        const machTexture = new THREE.CanvasTexture(machCanvas);

        const machPanelMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.5, 1.0),
            new THREE.MeshBasicMaterial({ map: machTexture, side: THREE.DoubleSide, transparent: true })
        );
        const machObjectiveGroup = new THREE.Group();
        machObjectiveGroup.add(machPanelMesh);
        scene.add(machObjectiveGroup);
        machObjectiveGroup.position.set(3.30, 1.80, -4.30);
        machObjectiveGroup.rotation.y = 0;
        machObjectiveGroup.visible = false;

        // -----------------------------------------------------------------
        // SCHEDA EMERGENZA (Fase 3) — Semplice
        // -----------------------------------------------------------------
        const emergCanvas = document.createElement('canvas');
        emergCanvas.width = DPI_CANVAS_W;
        emergCanvas.height = DPI_CANVAS_H;
        const emergCtx = emergCanvas.getContext('2d');
        const emergTexture = new THREE.CanvasTexture(emergCanvas);

        const emergPanelMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.5, 1.0),
            new THREE.MeshBasicMaterial({ map: emergTexture, side: THREE.DoubleSide, transparent: true })
        );
        const emergGroup = new THREE.Group();
        emergGroup.add(emergPanelMesh);
        scene.add(emergGroup);
        emergGroup.position.set(3, 1.8, -5.8);
        emergGroup.rotation.y = 0;
        emergGroup.visible = false;

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // Disegna scheda DPI (con check al completamento)
        function disegnaSchedaObiettivoDPI() {
            const W = DPI_CANVAS_W;
            const H = DPI_CANVAS_H;
            const font = fontReady ? "'Inter Tight'" : 'sans-serif';

            objCtx.clearRect(0, 0, W, H);
            objCtx.fillStyle = '#CCCCCC';
            roundRect(objCtx, 0, 0, W, H, 24);
            objCtx.fill();

            if (taskCompleted) {
                // Check grande
                objCtx.fillStyle = '#22c55e';
                objCtx.font = `100px ${font}`;
                objCtx.textAlign = 'center';
                objCtx.fillText('✔', W / 2, H / 2 - 40);

                // Testo completamento
                objCtx.font = `700 52px ${font}`;
                objCtx.fillText('Procedi al prossimo livello', W / 2, H / 2 + 50);
            } else {
                const badgeW = 155, badgeH = 42;
                objCtx.fillStyle = '#22c55e';
                roundRect(objCtx, 40, 32, badgeW, badgeH, 21);
                objCtx.fill();
                objCtx.fillStyle = '#ffffff';
                objCtx.font = `600 20px ${font}`;
                objCtx.textAlign = 'left';
                const measure2 = objCtx.measureText('Livello 1');
                objCtx.fillText('Livello 1', 40 + (badgeW - measure2.width) / 2, 59);

                objCtx.fillStyle = '#111111';
                objCtx.font = `700 58px ${font}`;
                objCtx.fillText('Ispezione DPI', 40, 145);

                objCtx.fillStyle = '#444444';
                objCtx.font = `400 26px ${font}`;
                objCtx.fillText('Seleziona gli oggetti presenti sul tavolo', 40, 185);

                objCtx.strokeStyle = '#cccccc';
                objCtx.lineWidth = 1.5;
                objCtx.beginPath();
                objCtx.moveTo(40, 210);
                objCtx.lineTo(W - 40, 210);
                objCtx.stroke();

                const cardW = 286;
                const cardH = 400;
                const cardY = 228;
                const cardStartX = 40;
                const cardGap = 26;

                ppeDati.forEach((dpi, i) => {
                    const cx = cardStartX + i * (cardW + cardGap);
                    const isSelected = inspectedObjects.has(dpi.id);

                    objCtx.fillStyle = '#E6E6E6';
                    roundRect(objCtx, cx, cardY, cardW, cardH, 16);
                    objCtx.fill();

                    if (isSelected) {
                        objCtx.strokeStyle = '#22c55e';
                        objCtx.lineWidth = 3;
                    } else {
                        objCtx.strokeStyle = 'rgba(0,0,0,0.08)';
                        objCtx.lineWidth = 1.5;
                    }
                    roundRect(objCtx, cx, cardY, cardW, cardH, 16);
                    objCtx.stroke();

                    objCtx.fillStyle = '#1a1a1a';
                    roundRect(objCtx, cx + 12, cardY + 12, cardW - 24, 210, 10);
                    objCtx.fill();

                    objCtx.save();
                    roundRect(objCtx, cx + 12, cardY + 12, cardW - 24, 210, 10);
                    objCtx.clip();
                    if (dpi.imgObj && dpi.imgObj.complete) {
                        const imgW = dpi.imgObj.width;
                        const imgH = dpi.imgObj.height;
                        const maxW = cardW - 24;
                        const maxH = 210;
                        const scale = Math.min(maxW / imgW, maxH / imgH);
                        const drawW = imgW * scale;
                        const drawH = imgH * scale;
                        const drawX = cx + 12 + (maxW - drawW) / 2;
                        const drawY = cardY + 12 + (maxH - drawH) / 2;
                        objCtx.drawImage(dpi.imgObj, drawX, drawY, drawW, drawH);
                    } else {
                        const icons = ['🪖', '🥽', '🧤'];
                        objCtx.font = '72px sans-serif';
                        objCtx.textAlign = 'center';
                        objCtx.fillText(icons[i], cx + cardW / 2, cardY + 137);
                    }
                    objCtx.restore();

                    objCtx.fillStyle = '#111111';
                    objCtx.font = `700 22px ${font}`;
                    objCtx.textAlign = 'left';
                    objCtx.fillText(dpi.title, cx + 16, cardY + 250);

                    objCtx.fillStyle = '#000000';
                    objCtx.font = `400 16px ${font}`;
                    const descWords = dpi.info.split(' ');
                    let line = ''; let ty = cardY + 278;
                    const maxTextY = cardY + 310;
                    for (let n = 0; n < descWords.length; n++) {
                        const testLine = line + descWords[n] + ' ';
                        if (objCtx.measureText(testLine).width > cardW - 32 && n > 0) {
                            objCtx.fillText(line, cx + 16, ty);
                            line = descWords[n] + ' '; ty += 22;
                        } else { line = testLine; }
                        if (ty > maxTextY) { line = ''; break; }
                    }
                    if (line && ty <= maxTextY) objCtx.fillText(line, cx + 16, ty);

                    objCtx.strokeStyle = '#e0e0e0';
                    objCtx.lineWidth = 1;
                    objCtx.beginPath();
                    objCtx.moveTo(cx + 16, cardY + cardH - 60);
                    objCtx.lineTo(cx + cardW - 16, cardY + cardH - 60);
                    objCtx.stroke();

                    const checkY = cardY + cardH - 44;
                    const checkBoxSize = 22;
                    const checkBoxX = cx + 16;
                    const checkBoxCY = checkY + checkBoxSize / 2;

                    if (isSelected) {
                        objCtx.fillStyle = '#22c55e';
                        roundRect(objCtx, checkBoxX, checkY, checkBoxSize, checkBoxSize, 6);
                        objCtx.fill();
                        objCtx.strokeStyle = '#ffffff';
                        objCtx.lineWidth = 3;
                        objCtx.lineCap = 'round';
                        objCtx.lineJoin = 'round';
                        objCtx.beginPath();
                        objCtx.moveTo(checkBoxX + 5, checkBoxCY);
                        objCtx.lineTo(checkBoxX + 9, checkBoxCY + 5);
                        objCtx.lineTo(checkBoxX + 17, checkBoxCY - 4);
                        objCtx.stroke();
                        objCtx.fillStyle = '#22c55e';
                        objCtx.font = `600 17px ${font}`;
                        objCtx.textAlign = 'left';
                        objCtx.fillText('Selezionato', checkBoxX + 30, checkY + 16);
                    } else {
                        objCtx.fillStyle = '#d4d4d4';
                        roundRect(objCtx, checkBoxX, checkY, checkBoxSize, checkBoxSize, 6);
                        objCtx.fill();
                        objCtx.fillStyle = '#999999';
                        objCtx.font = `500 17px ${font}`;
                        objCtx.textAlign = 'left';
                        objCtx.fillText('Da selezionare', checkBoxX + 30, checkY + 16);
                    }
                });

                objCtx.fillStyle = '#888888';
                objCtx.font = `500 20px ${font}`;
                objCtx.textAlign = 'right';
                objCtx.fillText(`${inspectedObjects.size} / ${totalObjectsToInspect} DPI ispezionati`, W - 40, H - 20);
            }

            objTexture.needsUpdate = true;
        }

        // Disegna scheda Macchinario (con check al completamento)
        function disegnaSchedaObiettivoMacchinario() {
            const W = DPI_CANVAS_W;
            const H = DPI_CANVAS_H;
            const font = fontReady ? "'Inter Tight'" : 'sans-serif';

            machCtx.clearRect(0, 0, W, H);
            machCtx.fillStyle = '#CCCCCC';
            roundRect(machCtx, 0, 0, W, H, 24);
            machCtx.fill();

            if (macchinarioTaskCompleted) {
                machCtx.fillStyle = '#22c55e';
                machCtx.font = `100px ${font}`;
                machCtx.textAlign = 'center';
                machCtx.fillText('✔', W / 2, H / 2 - 40);

                machCtx.font = `700 52px ${font}`;
                machCtx.fillText('Procedi al prossimo livello', W / 2, H / 2 + 50);
            } else {
                const badgeW = 210, badgeH = 42;
                machCtx.fillStyle = '#22c55e';
                roundRect(machCtx, 40, 32, badgeW, badgeH, 21);
                machCtx.fill();
                machCtx.fillStyle = '#ffffff';
                machCtx.font = `600 20px ${font}`;
                machCtx.textAlign = 'left';
                const measureBadge = machCtx.measureText('Livello 2');
                machCtx.fillText('Livello 2', 40 + (badgeW - measureBadge.width) / 2, 59);

                machCtx.fillStyle = '#111111';
                machCtx.font = `700 58px ${font}`;
                machCtx.fillText('Verifica Macchinario', 40, 145);

                machCtx.fillStyle = '#444444';
                machCtx.font = `400 26px ${font}`;
                machCtx.fillText('Seleziona i componenti del macchinario', 40, 185);

                machCtx.strokeStyle = '#cccccc';
                machCtx.lineWidth = 1.5;
                machCtx.beginPath();
                machCtx.moveTo(40, 210);
                machCtx.lineTo(W - 40, 210);
                machCtx.stroke();

                const cardW = 420;
                const cardH = 400;
                const cardY = 228;
                const cardStartX = 80;
                const cardGap = 40;

                macchinarioCardsData.forEach((comp, i) => {
                    const cx = cardStartX + i * (cardW + cardGap);
                    const isSelected = macchinarioInspectedObjects.has(comp.id);

                    machCtx.fillStyle = '#E6E6E6';
                    roundRect(machCtx, cx, cardY, cardW, cardH, 16);
                    machCtx.fill();

                    if (isSelected) {
                        machCtx.strokeStyle = '#22c55e';
                        machCtx.lineWidth = 3;
                    } else {
                        machCtx.strokeStyle = 'rgba(0,0,0,0.08)';
                        machCtx.lineWidth = 1.5;
                    }
                    roundRect(machCtx, cx, cardY, cardW, cardH, 16);
                    machCtx.stroke();

                    machCtx.fillStyle = '#1a1a1a';
                    roundRect(machCtx, cx + 12, cardY + 12, cardW - 24, 210, 10);
                    machCtx.fill();

                    machCtx.font = '80px sans-serif';
                    machCtx.fillStyle = '#ffffff';
                    machCtx.textAlign = 'center';
                    machCtx.fillText(comp.icon, cx + cardW / 2, cardY + 150);

                    machCtx.fillStyle = '#111111';
                    machCtx.font = `700 22px ${font}`;
                    machCtx.textAlign = 'left';
                    machCtx.fillText(comp.title, cx + 16, cardY + 250);

                    machCtx.fillStyle = '#000000';
                    machCtx.font = `400 16px ${font}`;
                    const descWords = comp.info.split(' ');
                    let line = ''; let ty = cardY + 278;
                    const maxTextY = cardY + 310;
                    for (let n = 0; n < descWords.length; n++) {
                        const testLine = line + descWords[n] + ' ';
                        if (machCtx.measureText(testLine).width > cardW - 32 && n > 0) {
                            machCtx.fillText(line, cx + 16, ty);
                            line = descWords[n] + ' '; ty += 22;
                        } else { line = testLine; }
                        if (ty > maxTextY) { line = ''; break; }
                    }
                    if (line && ty <= maxTextY) machCtx.fillText(line, cx + 16, ty);

                    machCtx.strokeStyle = '#e0e0e0';
                    machCtx.lineWidth = 1;
                    machCtx.beginPath();
                    machCtx.moveTo(cx + 16, cardY + cardH - 60);
                    machCtx.lineTo(cx + cardW - 16, cardY + cardH - 60);
                    machCtx.stroke();

                    const checkY = cardY + cardH - 44;
                    const checkBoxSize = 22;
                    const checkBoxX = cx + 16;
                    const checkBoxCY = checkY + checkBoxSize / 2;

                    if (isSelected) {
                        machCtx.fillStyle = '#22c55e';
                        roundRect(machCtx, checkBoxX, checkY, checkBoxSize, checkBoxSize, 6);
                        machCtx.fill();
                        machCtx.strokeStyle = '#ffffff';
                        machCtx.lineWidth = 3;
                        machCtx.lineCap = 'round';
                        machCtx.lineJoin = 'round';
                        machCtx.beginPath();
                        machCtx.moveTo(checkBoxX + 5, checkBoxCY);
                        machCtx.lineTo(checkBoxX + 9, checkBoxCY + 5);
                        machCtx.lineTo(checkBoxX + 17, checkBoxCY - 4);
                        machCtx.stroke();
                        machCtx.fillStyle = '#22c55e';
                        machCtx.font = `600 17px ${font}`;
                        machCtx.textAlign = 'left';
                        machCtx.fillText('Selezionato', checkBoxX + 30, checkY + 16);
                    } else {
                        machCtx.fillStyle = '#d4d4d4';
                        roundRect(machCtx, checkBoxX, checkY, checkBoxSize, checkBoxSize, 6);
                        machCtx.fill();
                        machCtx.fillStyle = '#999999';
                        machCtx.font = `500 17px ${font}`;
                        machCtx.textAlign = 'left';
                        machCtx.fillText('Da selezionare', checkBoxX + 30, checkY + 16);
                    }
                });

                machCtx.fillStyle = '#888888';
                machCtx.font = `500 20px ${font}`;
                machCtx.textAlign = 'right';
                machCtx.fillText(`${macchinarioInspectedObjects.size} / ${totalMacchinarioObjects} componenti verificati`, W - 40, H - 20);
            }

            machTexture.needsUpdate = true;
        }

        // NUOVA FUNZIONE SCHEDA EMERGENZA (Livello 3) – semplice, senza card
        function disegnaSchedaEmergenza() {
            const W = DPI_CANVAS_W;
            const H = DPI_CANVAS_H;
            const font = fontReady ? "'Inter Tight'" : 'sans-serif';

            emergCtx.clearRect(0, 0, W, H);
            emergCtx.fillStyle = '#CCCCCC';
            roundRect(emergCtx, 0, 0, W, H, 24);
            emergCtx.fill();

            if (emergenzaRisolta) {
                // Stato completato: check + testo
                emergCtx.fillStyle = '#22c55e';
                emergCtx.font = `100px ${font}`;
                emergCtx.textAlign = 'center';
                emergCtx.fillText('✔', W / 2, H / 2 - 40);

                emergCtx.font = `700 52px ${font}`;
                emergCtx.fillText('Procedi al prossimo livello', W / 2, H / 2 + 50);
            } else {
                // Badge Livello 3
                const badgeW = 210, badgeH = 42;
                emergCtx.fillStyle = '#ef4444';
                roundRect(emergCtx, 40, 32, badgeW, badgeH, 21);
                emergCtx.fill();
                emergCtx.fillStyle = '#ffffff';
                emergCtx.font = `600 20px ${font}`;
                emergCtx.textAlign = 'left';
                const measureBadge = emergCtx.measureText('Livello 3');
                emergCtx.fillText('Livello 3', 40 + (badgeW - measureBadge.width) / 2, 59);

                // Titolo
                emergCtx.fillStyle = '#111111';
                emergCtx.font = `700 58px ${font}`;
                emergCtx.textAlign = 'center';
                emergCtx.fillText('Emergenza Macchinario', W / 2, 145);

                // Simbolo di pericolo grande
                emergCtx.fillStyle = '#ef4444';
                emergCtx.font = `150px sans-serif`;
                emergCtx.textAlign = 'center';
                emergCtx.fillText('⚠️', W / 2, H / 2 - 20);

                // Istruzione in rosso
                emergCtx.fillStyle = '#ef4444';
                emergCtx.font = `700 32px ${font}`;
                emergCtx.textAlign = 'center';
                wrapTextCentrato(emergCtx, 'Premi il pulsante di emergenza rosso sul macchinario', W / 2, H / 2 + 100, 800, 42);
            }

            emergTexture.needsUpdate = true;
        }

        // Inizializzazione disegni
        disegnaSchedaObiettivoDPI();
        disegnaSchedaObiettivoMacchinario();
        disegnaSchedaEmergenza();

        // Caricamento modelli 3D DPI
        ppeDati.forEach((data) => {
            gltfLoader.load(data.url, (gltf) => {
                const model = gltf.scene; model.position.copy(data.pos);
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.userData.isInteractable = true; child.userData.id = data.id;
                        child.userData.title = data.title; child.userData.info = data.info;
                        child.userData.isFaseMacchinario = false;
                        interactables.push(child);
                    }
                });
                scene.add(model);
            }, null, (error) => { console.error(`Errore caricamento ${data.id}:`, error); });
        });

        // Setup Teletrasporto, Controller & Laser
        const teleportHeight = 0.6; const teleportRadius = 0.25;
        const teleportGeo = new THREE.CylinderGeometry(teleportRadius, teleportRadius, teleportHeight, 32, 1, true).translate(0, teleportHeight / 2, 0);
        const teleportMat = new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(0x00d2ff) } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec2 vUv; uniform vec3 uColor; void main() { float alpha = 1.0 - vUv.y; alpha = pow(alpha, 1.5); gl_FragColor = vec4(uColor, alpha); }`,
            transparent: true, side: THREE.DoubleSide, depthWrite: false
        });
        const teleportMarker = new THREE.Mesh(teleportGeo, teleportMat); teleportMarker.visible = false; scene.add(teleportMarker);

        const controller1 = renderer.xr.getController(0); const controller2 = renderer.xr.getController(1);
        cameraRig.add(controller1); cameraRig.add(controller2);

        const controllerModelFactory = new XRControllerModelFactory();
        const grip1 = renderer.xr.getControllerGrip(0); grip1.add(controllerModelFactory.createControllerModel(grip1)); cameraRig.add(grip1);
        const grip2 = renderer.xr.getControllerGrip(1); grip2.add(controllerModelFactory.createControllerModel(grip2)); cameraRig.add(grip2);

        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
        const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        const line1 = new THREE.Line(laserGeo, laserMat); line1.name = 'line'; line1.scale.z = 10; controller1.add(line1);
        const line2 = new THREE.Line(laserGeo, laserMat.clone()); line2.name = 'line'; line2.scale.z = 10; controller2.add(line2);

        let isTeleportMode = false; let activeTeleportController = null; let teleportPoint = new THREE.Vector3();

        function onTriggerStart(event) {
            if (isTutorialActive) return;
            activeTeleportController = event.target; isTeleportMode = true;
        }

        function onTriggerEnd(event) {
            if (isTutorialActive) return;
            if (isTeleportMode && teleportMarker.visible && activeTeleportController === event.target) {
                cameraRig.position.set(teleportPoint.x, cameraRig.position.y, teleportPoint.z);
            }
            isTeleportMode = false; teleportMarker.visible = false; activeTeleportController = null;
        }
        controller1.addEventListener('selectstart', onTriggerStart); controller1.addEventListener('selectend', onTriggerEnd);
        controller2.addEventListener('selectstart', onTriggerStart); controller2.addEventListener('selectend', onTriggerEnd);

        // -----------------------------------------------------------------
        // LOOP ANIMAZIONE PRINCIPALE (senza pannello informativo)
        // -----------------------------------------------------------------
        const raycaster = new THREE.Raycaster();
        const workingMatrix = new THREE.Matrix4();
        const MAX_LASER_RANGE = 10;
        const prevButtonsState = { left: false, right: false };
        let currentHoverObject = null; // solo per highlight

        renderer.setAnimationLoop(() => {
            const session = renderer.xr.getSession();
            const time = performance.now() * 0.003;

            if (currentHoverObject && currentHoverObject.material && currentHoverObject.material.emissive) {
                currentHoverObject.material.emissive.setHex(0x000000);
                currentHoverObject = null;
            }

            // TAPPA 1 LOGIC
            if (!isTutorialActive && !stage1Triggered) {
                stageMarkerMat.opacity = 0.3 + Math.sin(time * 2) * 0.4;
                stageTriangle1.position.y = 0.5 + Math.sin(time * 2.5) * 0.06;

                const userPos2D = new THREE.Vector2(cameraRig.position.x, cameraRig.position.z);
                const targetPos2D = new THREE.Vector2(targetStage1.x, targetStage1.z);

                if (userPos2D.distanceTo(targetPos2D) < 0.5) {
                    stage1Triggered = true;
                    locationPointerGroup1.visible = false;
                    disegnaSchedaObiettivoDPI();
                    objectiveGroup.visible = true;
                }
            }

            // TAPPA 2 LOGIC
            if (taskCompleted && !stage2Triggered) {
                locationPointerGroup2.visible = true;
                stageMarkerMat.opacity = 0.3 + Math.sin(time * 2) * 0.4;
                stageTriangle2.position.y = 0.5 + Math.sin(time * 2.5) * 0.06;

                const userPos2D = new THREE.Vector2(cameraRig.position.x, cameraRig.position.z);
                const targetPos2D2 = new THREE.Vector2(targetStage2.x, targetStage2.z);

                if (userPos2D.distanceTo(targetPos2D2) < 0.5) {
                    stage2Triggered = true;
                    locationPointerGroup2.visible = false;
                    objectiveGroup.visible = false;
                    machObjectiveGroup.visible = true;
                }
            }

            // TAPPA 3 LOGIC (Allarme)
            if (macchinarioTaskCompleted && !stage3Triggered) {
                locationPointerGroup3.visible = true;
                stageMarkerMat.opacity = 0.3 + Math.sin(time * 2) * 0.4;
                stageTriangle3.position.y = 0.5 + Math.sin(time * 2.5) * 0.06;

                const userPos2D = new THREE.Vector2(cameraRig.position.x, cameraRig.position.z);
                const targetPos2D3 = new THREE.Vector2(targetStage3.x, targetStage3.z);

                if (userPos2D.distanceTo(targetPos2D3) < 0.6) {
                    stage3Triggered = true;
                    locationPointerGroup3.visible = false;
                    machObjectiveGroup.visible = false;
                    emergGroup.visible = true;

                    if (rumoreAudio.buffer && !rumoreAudio.isPlaying) {
                        rumoreAudio.play();
                    }
                }
            }

            if (session) {
                let hoveringThisFrame = false;

                for (const source of session.inputSources) {
                    const controller = source.handedness === 'right' ? controller1 : controller2;
                    const line = controller.getObjectByName('line');
                    line.scale.z = MAX_LASER_RANGE;

                    workingMatrix.identity().extractRotation(controller.matrixWorld);
                    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(workingMatrix);

                    let currentRayLength = MAX_LASER_RANGE;

                    if (isTutorialActive) {
                        const tutIntersects = raycaster.intersectObject(tutorialMesh);
                        if (tutIntersects.length > 0) {
                            currentRayLength = tutIntersects[0].distance;
                            const uv = tutIntersects[0].uv;
                            if (uv.x >= 0.2 && uv.x <= 0.8 && uv.y >= 0.05 && uv.y <= 0.15) {
                                hoveringThisFrame = true;
                            }
                        }
                        line.scale.z = currentRayLength;
                    } else {
                        const objIntersects = raycaster.intersectObjects(interactables);
                        if (objIntersects.length > 0) {
                            currentHoverObject = objIntersects[0].object; currentRayLength = objIntersects[0].distance;
                            if (!isTeleportMode && currentHoverObject.material && currentHoverObject.material.emissive) {
                                currentHoverObject.material.emissive.setHex(0x333333);
                            }
                        }

                        const teleportIntersects = raycaster.intersectObjects(environmentColliders, true);
                        if (teleportIntersects.length > 0) {
                            const hitObj = teleportIntersects[0].object;
                            const hitDist = teleportIntersects[0].distance;

                            if (isTeleportMode && controller === activeTeleportController) {
                                if (hitObj.name === 'floor') {
                                    currentRayLength = hitDist;
                                    teleportPoint.copy(teleportIntersects[0].point);
                                    teleportMarker.position.copy(teleportPoint).y = 0.001;
                                    teleportMarker.visible = true;
                                } else {
                                    currentRayLength = hitDist;
                                    teleportMarker.visible = false;
                                }
                            } else if (!objIntersects.length) {
                                currentRayLength = hitDist;
                            }
                        } else if (isTeleportMode && controller === activeTeleportController) {
                            teleportMarker.visible = false;
                        }

                        line.scale.z = currentRayLength;
                    }

                    if (source.gamepad) {
                        const buttonPressed = source.gamepad.buttons[4]?.pressed || false;
                        const hand = source.handedness;

                        if (buttonPressed && !prevButtonsState[hand]) {
                            if (isTutorialActive) {
                                if (isHoveringButton) {
                                    playSelectSound();
                                    tutorialIndex++;
                                    if (tutorialIndex < tutorialSlides.length) {
                                        disegnaTutorialHUD();
                                    } else {
                                        isTutorialActive = false;
                                        tutorialGroup.visible = false;
                                        locationPointerGroup1.visible = true;
                                    }
                                }
                            } else if (currentHoverObject) {
                                playSelectSound();
                                const data = currentHoverObject.userData;

                                // EMERGENZA (TAPPA 3)
                                if (stage3Triggered && !emergenzaRisolta && data.id === "tasto_emergenza") {
                                    emergenzaRisolta = true;
                                    if (rumoreAudio.isPlaying) rumoreAudio.stop();
                                    disegnaSchedaEmergenza();
                                }

                                // DPI (FASE 1)
                                if (stage1Triggered && !taskCompleted && !data.isFaseMacchinario) {
                                    inspectedObjects.add(data.id);
                                    if (inspectedObjects.size === totalObjectsToInspect) taskCompleted = true;
                                    disegnaSchedaObiettivoDPI();
                                }

                                // MACCHINARIO (FASE 2) – senza popup, solo registrazione
                                if (stage2Triggered && !macchinarioTaskCompleted && data.isFaseMacchinario) {
                                    macchinarioInspectedObjects.add(data.id);
                                    if (macchinarioInspectedObjects.size === totalMacchinarioObjects) macchinarioTaskCompleted = true;
                                    disegnaSchedaObiettivoMacchinario();
                                }
                            }
                        }
                        prevButtonsState[hand] = buttonPressed;
                    }
                }

                if (isTutorialActive && hoveringThisFrame !== isHoveringButton) {
                    isHoveringButton = hoveringThisFrame;
                    disegnaTutorialHUD();
                }
            }
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
