<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Chess AR Experience</title>
  <meta itemprop="name" content="Chess AR Experience">
  <meta name="twitter:title" content="Chess AR Experience">
  <meta property="og:title" content="Chess AR Experience">
  <meta property="og:site_name" content="Chess AR Experience">
  <meta name="description" content="AR Chess orbit experience.">
  <meta itemprop="description" content="AR Chess orbit experience.">
  <meta property="og:description" content="AR Chess orbit experience.">
  <meta name="twitter:description" content="AR Chess orbit experience.">
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam">
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }

    #ui-overlay {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 100;
      pointer-events: none;
    }

    #tap-hint {
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 0.08em;
      padding: 10px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease;
    }

    #tap-hint.hidden { opacity: 0; pointer-events: none; }

    #reset-btn {
      pointer-events: all;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 28px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(8px);
      cursor: pointer;
      display: none;
      transition: background 0.2s ease;
    }
    #reset-btn:active { background: rgba(255,255,255,0.25); }
  </style>
</head>

<body>

  <div id="ui-overlay">
    <div id="tap-hint">Tocca una superficie per posizionare gli scacchi</div>
    <button id="reset-btn" onclick="window.arOrbit && window.arOrbit.resetPlacement()">↺ Riposiziona</button>
  </div>

  <script src="bundle.js"></script>
</body>

</html>
