<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training VR Industriale - Obiettivi in Spazio 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // -----------------------------------------------------------------
        // CONFIGURAZIONE AMBIENTE E CAMERA RIG (Setup VR Standard)
        // -----------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.06);

        const cameraRig = new THREE.Group();
        cameraRig.position.set(0, 0, 2); 
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        cameraRig.add(camera);
        scene.add(cameraRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; 
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(3, 10, 3);
        scene.add(dirLight);

        // Pavimento e griglia
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.name = 'floor';
        scene.add(floor);

        const grid = new THREE.GridHelper(40, 40, 0x333333, 0x222222);
        grid.position.y = 0.001;
        scene.add(grid);

        // Banco da lavoro
        const table = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x2b2b2b })
        );
        table.position.set(0, 0.4, -1.5);
        table.name = 'table';
        scene.add(table);

        const interactables = [];

        // -----------------------------------------------------------------
        // CONFIGURAZIONE LOCATION POINTER (TAPPA 1)
        // -----------------------------------------------------------------
        const targetStage1 = new THREE.Vector3(0, 0.01, -0.6); 
        let stage1Triggered = false;

        const locationPointerGroup = new THREE.Group();
        locationPointerGroup.position.copy(targetStage1);
        scene.add(locationPointerGroup);

        const stageMarkerMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const stageMarker = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.35, 32).rotateX(-Math.PI / 2), stageMarkerMat);
        locationPointerGroup.add(stageMarker);

        const coneGeo = new THREE.ConeGeometry(0.08, 0.2, 4).rotateX(Math.PI); 
        const stageTriangle = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({ color: 0x00d2ff }));
        stageTriangle.position.y = 0.5; 
        locationPointerGroup.add(stageTriangle);


        // -----------------------------------------------------------------
        // SISTEMA DI TRACCIAMENTO ISPEZIONE OGGETTI
        // -----------------------------------------------------------------
        const inspectedObjects = new Set(); 
        const totalObjectsToInspect = 3;
        let taskCompleted = false;


        // -----------------------------------------------------------------
        // CREAZIONE SCHEDA OBIETTIVO (Fissa nello Spazio 3D)
        // -----------------------------------------------------------------
        // Risoluzione aumentata (512x320) per garantire testi nitidi nel mondo 3D a distanza
        const objCanvas = document.createElement('canvas'); objCanvas.width = 512; objCanvas.height = 320;
        const objCtx = objCanvas.getContext('2d');
        const objTexture = new THREE.CanvasTexture(objCanvas);

        // Geometria fisica del pannello nello spazio (Larghezza: 0.8m, Altezza: 0.5m)
        const objPanelGeo = new THREE.PlaneGeometry(0.8, 0.5);
        const objPanelMat = new THREE.MeshBasicMaterial({ map: objTexture, side: THREE.DoubleSide, transparent: true });
        const objPanelMesh = new THREE.Mesh(objPanelGeo, objPanelMat);

        const objectiveGroup = new THREE.Group();
        objectiveGroup.add(objPanelMesh);
        
        // MODIFICA CRUCCIALE: Agganciato alla SCENA globale e non alla camera del visore
        scene.add(objectiveGroup);
        
        // Posizionato fluttuante nello spazio a livello occhi (Y=1.45) subito dietro al banco da lavoro (Z=-1.96)
        objectiveGroup.position.set(0, 1.45, -1.96); 
        objectiveGroup.visible = false; // Appare solo quando l'utente calpesta il pointer

        function disegnaSchedaObiettivo3D() {
            objCtx.clearRect(0, 0, 512, 320);
            
            // Sfondo scuro olografico
            objCtx.fillStyle = 'rgba(15, 15, 15, 0.95)'; objCtx.fillRect(0, 0, 512, 320);
            
            if (taskCompleted) {
                objCtx.strokeStyle = '#00ff66'; 
                objCtx.lineWidth = 6; objCtx.strokeRect(0, 0, 512, 320);
                
                objCtx.fillStyle = '#00ff66'; objCtx.font = 'bold 24px sans-serif'; objCtx.fillText("✔ OBIETTIVO COMPLETATO", 40, 60);
                objCtx.fillStyle = '#ffffff'; objCtx.font = '18px sans-serif';
                objCtx.fillText("Tutti i DPI sul banco sono stati verificati.", 40, 130);
                objCtx.fillStyle = '#00d2ff'; objCtx.font = 'bold 16px sans-serif'; objCtx.fillText("PROSSIMA AREA DI ADDESTRAMENTO SBLOCCATA", 40, 240);
            } else {
                objCtx.strokeStyle = 'rgba(0, 210, 255, 0.5)'; 
                objCtx.lineWidth = 6; objCtx.strokeRect(0, 0, 512, 320);

                objCtx.fillStyle = '#00d2ff'; objCtx.font = 'bold 22px sans-serif'; objCtx.fillText("OBIETTIVO: ISPEZIONE DPI", 40, 60);
                
                objCtx.fillStyle = '#cccccc'; objCtx.font = '16px sans-serif';
                wrapText(objCtx, "Seleziona ed apri la scheda informativa di tutti e tre i dispositivi di protezione presenti sul tavolo per verificarne la conformità tecnica prima di iniziare i lavori.", 40, 110, 432, 26);
                
                // Avanzamento numerico
                objCtx.fillStyle = '#ffffff'; objCtx.font = 'bold 18px sans-serif';
                objCtx.fillText(`DPI Ispezionati: ${inspectedObjects.size} / ${totalObjectsToInspect}`, 40, 260);
            }
            objTexture.needsUpdate = true;
        }


        // -----------------------------------------------------------------
        // CONFIGURAZIONE SCHEDA INFORMATIVA DPI (Fissa sul Visore)
        // -----------------------------------------------------------------
        let isInfoPanelOpen = false;
        let currentHoverObject = null;
        let currentAttachedObject = null; 

        const ppeDati = [
            { id: "casco", url: 'assets/safety/casco.glb', pos: new THREE.Vector3(-0.6, 0.8, -1.5), title: "Casco di Sicurezza", info: "Protegge il capo da urti accidentali e dalla caduta dall'alto di materiali. Ispeziona regolarmente per crepe." },
            { id: "imbragatura", url: 'assets/safety/imbragatura.glb', pos: new THREE.Vector3(0, 0.92, -1.5), title: "Imbragatura Anticaduta", info: "Dispositivo salvavita obbligatorio per lavori operativi oltre i 2 metri d'altezza. Controlla i punti di aggancio." },
            { id: "scarpe", url: 'assets/safety/scarpe.glb', pos: new THREE.Vector3(0.6, 0.85, -1.5), title: "Scarpe Tecniche", info: "Puntale rinforzato in acciaio contro schiacciamenti accidentali e suola antiscivolo. Obbligatorie in cantiere." }
        ];

        const infoCanvas = document.createElement('canvas'); infoCanvas.width = 400; infoCanvas.height = 300;
        const infoCtx = infoCanvas.getContext('2d');
        const infoTexture = new THREE.CanvasTexture(infoCanvas);
        
        const infoPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.45), new THREE.MeshBasicMaterial({ map: infoTexture, side: THREE.DoubleSide }));
        const infoGroup = new THREE.Group(); 
        infoGroup.add(infoPanelMesh); 
        infoGroup.visible = false; 
        camera.add(infoGroup); 
        infoGroup.position.set(0, 0, -0.8); // Rimane agganciato al centro degli occhi durante la lettura

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' '); let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight;
                } else { line = testLine; }
            } ctx.fillText(line, x, y);
        }

        function disegnaSchedaMinimalSolida(titolo, descrizione) {
            infoCtx.fillStyle = '#121212'; infoCtx.fillRect(0, 0, 400, 300);
            infoCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; infoCtx.lineWidth = 4; infoCtx.strokeRect(0, 0, 400, 300);
            infoCtx.fillStyle = '#ffffff'; infoCtx.font = '500 22px sans-serif'; infoCtx.fillText(titolo.toUpperCase(), 30, 50);
            infoCtx.fillStyle = '#aaaaaa'; infoCtx.font = '300 16px sans-serif';
            wrapText(infoCtx, descrizione, 30, 95, 340, 24);
            infoCtx.fillStyle = '#666666'; infoCtx.font = 'bold 12px sans-serif'; infoCtx.fillText("PREMI A / X PER CHIUDERE", 30, 265);
            infoTexture.needsUpdate = true; 
        }

        // Caricamento modelli .GLB
        const gltfLoader = new GLTFLoader();
        ppeDati.forEach((data) => {
            gltfLoader.load(data.url, (gltf) => {
                const model = gltf.scene; model.position.copy(data.pos);
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.userData.isInteractable = true; 
                        child.userData.id = data.id; 
                        child.userData.title = data.title; 
                        child.userData.info = data.info;
                        interactables.push(child); 
                    }
                });
                scene.add(model);
            }, null, (error) => { console.error(error); });
        });

        // -----------------------------------------------------------------
        // TELETRASPORTO VOLUMETRICO SFUMATO
        // -----------------------------------------------------------------
        const teleportHeight = 0.6; const teleportRadius = 0.25; 
        const teleportGeo = new THREE.CylinderGeometry(teleportRadius, teleportRadius, teleportHeight, 32, 1, true);
        teleportGeo.translate(0, teleportHeight / 2, 0); 

        const teleportMat = new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(0x00d2ff) } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec2 vUv; uniform vec3 uColor; void main() { float alpha = 1.0 - vUv.y; alpha = pow(alpha, 1.5); gl_FragColor = vec4(uColor, alpha); }`,
            transparent: true, side: THREE.DoubleSide, depthWrite: false       
        });

        const teleportMarker = new THREE.Mesh(teleportGeo, teleportMat);
        teleportMarker.visible = false; scene.add(teleportMarker);

        // Setup Controller & Laser
        const controller1 = renderer.xr.getController(0); const controller2 = renderer.xr.getController(1);
        cameraRig.add(controller1); cameraRig.add(controller2);

        const controllerModelFactory = new XRControllerModelFactory();
        const grip1 = renderer.xr.getControllerGrip(0); grip1.add(controllerModelFactory.createControllerModel(grip1)); cameraRig.add(grip1);
        const grip2 = renderer.xr.getControllerGrip(1); grip2.add(controllerModelFactory.createControllerModel(grip2)); cameraRig.add(grip2);

        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
        const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        const line1 = new THREE.Line(laserGeo, laserMat); line1.name = 'line'; line1.scale.z = 10; controller1.add(line1);
        const line2 = new THREE.Line(laserGeo, laserMat.clone()); line2.name = 'line'; line2.scale.z = 10; controller2.add(line2);

        let isTeleportMode = false; let activeTeleportController = null; let teleportPoint = new THREE.Vector3();

        function onTriggerStart(event) { activeTeleportController = event.target; isTeleportMode = true; }
        function onTriggerEnd(event) {
            if (isTeleportMode && teleportMarker.visible && activeTeleportController === event.target) {
                cameraRig.position.set(teleportPoint.x, cameraRig.position.y, teleportPoint.z);
            }
            isTeleportMode = false; teleportMarker.visible = false; activeTeleportController = null;
        }
        controller1.addEventListener('selectstart', onTriggerStart); controller1.addEventListener('selectend', onTriggerEnd);
        controller2.addEventListener('selectstart', onTriggerStart); controller2.addEventListener('selectend', onTriggerEnd);


        // -----------------------------------------------------------------
        // LOOP ANIMAZIONE PRINCIPALE & LOGICA DEI FRAME
        // -----------------------------------------------------------------
        const raycaster = new THREE.Raycaster();
        const workingMatrix = new THREE.Matrix4();
        const MAX_LASER_RANGE = 10;
        const prevButtonsState = { left: false, right: false }; 
        
        renderer.setAnimationLoop(() => {
            const session = renderer.xr.getSession();
            const time = performance.now() * 0.003; 
            
            if (currentHoverObject && currentHoverObject.material && currentHoverObject.material.emissive) {
                currentHoverObject.material.emissive.setHex(0x000000);
                currentHoverObject = null;
            }

            // --- ANIMAZIONE LOCATION POINTER ---
            if (!stage1Triggered) {
                stageMarkerMat.opacity = 0.3 + Math.sin(time * 2) * 0.4;
                stageTriangle.position.y = 0.5 + Math.sin(time * 2.5) * 0.06;

                const userPos2D = new THREE.Vector2(cameraRig.position.x, cameraRig.position.z);
                const targetPos2D = new THREE.Vector2(targetStage1.x, targetStage1.z);
                
                if (userPos2D.distanceTo(targetPos2D) < 0.5) {
                    stage1Triggered = true;
                    locationPointerGroup.visible = false; 
                    
                    // Inizializza graficamente e mostra la lavagna obiettivi nel mondo 3D
                    disegnaSchedaObiettivo3D();
                    objectiveGroup.visible = true; 
                }
            }

            if (session) {
                for (const source of session.inputSources) {
                    const controller = source.handedness === 'right' ? controller1 : controller2;
                    const line = controller.getObjectByName('line');
                    line.scale.z = MAX_LASER_RANGE; 

                    workingMatrix.identity().extractRotation(controller.matrixWorld);
                    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(workingMatrix);

                    let currentRayLength = MAX_LASER_RANGE;

                    const objIntersects = raycaster.intersectObjects(interactables);
                    if (objIntersects.length > 0) {
                        currentHoverObject = objIntersects[0].object;
                        currentRayLength = objIntersects[0].distance; 
                        if (!isTeleportMode && currentHoverObject.material && currentHoverObject.material.emissive) {
                            currentHoverObject.material.emissive.setHex(0x222222);
                        }
                    }

                    const teleportIntersects = raycaster.intersectObjects([floor, table]);
                    if (teleportIntersects.length > 0) {
                        const hitObj = teleportIntersects[0].object; const hitDist = teleportIntersects[0].distance;
                        if (isTeleportMode && controller === activeTeleportController) {
                            if (hitObj === floor) {
                                currentRayLength = hitDist; teleportPoint.copy(teleportIntersects[0].point);
                                teleportMarker.position.copy(teleportPoint); teleportMarker.position.y = 0.001;
                                teleportMarker.visible = true;
                            } else if (hitObj === table) {
                                currentRayLength = hitDist; teleportMarker.visible = false; 
                            }
                        } else if (!objIntersects.length) { currentRayLength = hitDist; }
                    } else if (isTeleportMode && controller === activeTeleportController) {
                        teleportMarker.visible = false;
                    }

                    line.scale.z = currentRayLength; 

                    // --- INPUT E LOGICA COMPLETAMENTO ---
                    if (source.gamepad) {
                        const buttonPressed = source.gamepad.buttons[4]?.pressed || false; const hand = source.handedness;
                        if (buttonPressed && !prevButtonsState[hand]) {
                            if (currentHoverObject) {
                                const data = currentHoverObject.userData;
                                if (isInfoPanelOpen) {
                                    if (currentAttachedObject === currentHoverObject) {
                                        infoGroup.visible = false; isInfoPanelOpen = false; currentAttachedObject = null;
                                    } else {
                                        disegnaSchedaMinimalSolida(data.title, data.info); currentAttachedObject = currentHoverObject;
                                    }
                                } else {
                                    disegnaSchedaMinimalSolida(data.title, data.info); infoGroup.visible = true; isInfoPanelOpen = true; currentAttachedObject = currentHoverObject;
                                    
                                    // Se l'utente esamina l'oggetto corrente, aggiorna la lavagna 3D sullo sfondo
                                    if (stage1Triggered && !taskCompleted) {
                                        inspectedObjects.add(data.id);
                                        if (inspectedObjects.size === totalObjectsToInspect) {
                                            taskCompleted = true;
                                        }
                                        disegnaSchedaObiettivo3D(); 
                                    }
                                }
                            } else if (isInfoPanelOpen) {
                                infoGroup.visible = false; isInfoPanelOpen = false; currentAttachedObject = null;
                            }
                        }
                        prevButtonsState[hand] = buttonPressed; 
                    }
                }
            }
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
