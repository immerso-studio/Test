<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corso VR - Formazione Sicurezza</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <script>
    // Corregge la rotazione del modello .GLB delle mani
    AFRAME.registerComponent('fix-rotazione-mani', {
      schema: {
        rotazione: {type: 'vec3', default: {x: 90, y: 180, z: 0}}
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          this.el.setAttribute('rotation', this.data.rotazione);
        });
      }
    });

    // Outline bianco puro senza riempimento
    AFRAME.registerComponent('outline', {
      schema: {
        color: {default: '#ffffff'},
        scale: {default: 1.08},
        pulse: {default: false},
        frequency: {default: 1}
      },

      init: function () {
        this.el.addEventListener('loaded', () => {
          this.createOutline();
        });

        this.el.addEventListener('raycaster-intersected', () => {
          if (this.outlineMesh) {
            this.outlineMesh.visible = true;
          }
        });
        
        this.el.addEventListener('raycaster-intersected-cleared', () => {
          if (this.outlineMesh) {
            this.outlineMesh.visible = false;
          }
        });
      },

      createOutline: function () {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) {
          console.warn('outline: nessuna mesh trovata per', this.el);
          return;
        }

        const geometry = mesh.geometry.clone();
        
        const material = new THREE.MeshBasicMaterial({
          color: this.data.color,
          side: THREE.BackSide,
          depthTest: false,
          depthWrite: false,
          transparent: true,
          opacity: 1.0,
        });

        this.outlineMesh = new THREE.Mesh(geometry, material);
        this.outlineMesh.scale.setScalar(this.data.scale);
        this.outlineMesh.visible = false;
        this.outlineMesh.renderOrder = 999;
        
        this.el.object3D.add(this.outlineMesh);
      },

      tick: function (t) {
        if (this.data.pulse && this.outlineMesh) {
          const s = this.data.scale + 0.02 * Math.sin(this.data.frequency * t / 120);
          this.outlineMesh.scale.setScalar(s);
        }
      }
    });

    // Componente per sincronizzare teleport e laser
    AFRAME.registerComponent('sync-teleport-laser', {
      init: function () {
        this.synced = false;
        
        this.el.addEventListener('loaded', () => {
          this.setupSync();
        });
        
        setTimeout(() => {
          if (!this.synced) this.setupSync();
        }, 1000);
      },

      setupSync: function () {
        const blinkControls = this.el.components['blink-controls'];
        const raycaster = this.el.components['raycaster'];
        
        if (!blinkControls || !raycaster) return;
        
        blinkControls.data.curveTint = '#ffffff';
        blinkControls.data.curveOpacity = 0.8;
        
        if (blinkControls.raycaster && raycaster.raycaster) {
          Object.defineProperty(blinkControls, 'raycaster', {
            get: function() { return raycaster.raycaster; },
            configurable: true
          });
        }
        
        this.synced = true;
      },

      tick: function () {
        const blinkControls = this.el.components['blink-controls'];
        const raycaster = this.el.components['raycaster'];
        
        if (!blinkControls || !raycaster) return;
        
        if (blinkControls.curveMaterial) {
          blinkControls.curveMaterial.color.set('#ffffff');
          blinkControls.curveMaterial.opacity = 0.8;
        }
        
        if (raycaster.line) {
          if (blinkControls.isTeleporting) {
            raycaster.line.visible = false;
          } else if (raycaster.data.showLine) {
            raycaster.line.visible = true;
          }
        }
      }
    });

    // Componente per la scheda informativa in VR
    AFRAME.registerComponent('info-card', {
      schema: {
        title: {type: 'string', default: 'Informazioni'},
        description: {type: 'string', default: 'Descrizione dell\'oggetto'},
        image: {type: 'string', default: ''}
      },

      init: function () {
        this.cardVisible = false;
        this.cardEntity = null;
        this.createCard();
        
        // Listener per i pulsanti A (destro) e X (sinistro)
        this.el.addEventListener('abuttondown', () => {
          if (this.el.id === 'rightHand') this.toggleCard();
        });
        
        this.el.addEventListener('xbuttondown', () => {
          if (this.el.id === 'leftHand') this.toggleCard();
        });
        
        // Listener per il click del mouse in modalità desktop
        this.el.addEventListener('click', () => {
          this.toggleCard();
        });
      },

      createCard: function () {
        // Crea la scheda come entità A-Frame
        const card = document.createElement('a-entity');
        card.setAttribute('id', 'info-card');
        card.setAttribute('position', '0 1.6 -2');
        card.setAttribute('visible', 'false');
        
        // Sfondo della scheda
        card.innerHTML = `
          <a-plane 
            position="0 0 0" 
            width="0.8" 
            height="0.6" 
            color="#1a1a2e" 
            material="shader: flat; opacity: 0.95; transparent: true">
          </a-plane>
          
          <!-- Bordo della scheda -->
          <a-plane 
            position="0 0 0.001" 
            width="0.82" 
            height="0.62" 
            color="#4cc9f0" 
            material="shader: flat; side: back; opacity: 0.5">
          </a-plane>
          
          <!-- Titolo -->
          <a-text 
            position="0 0.22 0.002" 
            value="${this.data.title}" 
            align="center" 
            color="#ffffff" 
            width="0.7"
            font="mozillavr">
          </a-text>
          
          <!-- Linea separatrice -->
          <a-plane 
            position="0 0.15 0.002" 
            width="0.7" 
            height="0.002" 
            color="#4cc9f0">
          </a-plane>
          
          <!-- Descrizione -->
          <a-text 
            position="0 -0.05 0.002" 
            value="${this.data.description}" 
            align="center" 
            color="#cccccc" 
            width="0.7"
            font="mozillavr">
          </a-text>
          
          <!-- Bottone X per chiudere -->
          <a-plane 
            class="close-button"
            position="0.35 0.25 0.003" 
            width="0.08" 
            height="0.08" 
            color="#f72585"
            material="shader: flat">
          </a-plane>
          
          <a-text 
            class="close-button"
            position="0.35 0.25 0.004" 
            value="✕" 
            align="center" 
            color="#ffffff" 
            width="0.05"
            font="mozillavr">
          </a-text>
        `;
        
        this.el.sceneEl.appendChild(card);
        this.cardEntity = card;
        
        // Listener per chiudere la scheda
        setTimeout(() => {
          const closeButtons = document.querySelectorAll('.close-button');
          closeButtons.forEach(button => {
            button.addEventListener('click', (e) => {
              e.stopPropagation();
              this.hideCard();
            });
          });
        }, 500);
      },

      toggleCard: function () {
        if (this.cardVisible) {
          this.hideCard();
        } else {
          this.showCard();
        }
      },

      showCard: function () {
        if (this.cardEntity) {
          // Posiziona la scheda davanti alla camera
          const camera = document.querySelector('#camera');
          if (camera) {
            const cameraPos = camera.getAttribute('position');
            const cameraRot = camera.getAttribute('rotation');
            
            // Calcola posizione davanti alla camera
            const radY = THREE.MathUtils.degToRad(cameraRot.y);
            const distance = 1.5;
            const x = cameraPos.x - Math.sin(radY) * distance;
            const z = cameraPos.z - Math.cos(radY) * distance;
            
            this.cardEntity.setAttribute('position', `${x} ${cameraPos.y} ${z}`);
            this.cardEntity.setAttribute('rotation', `0 ${cameraRot.y} 0`);
          }
          
          this.cardEntity.setAttribute('visible', 'true');
          this.cardVisible = true;
        }
      },

      hideCard: function () {
        if (this.cardEntity) {
          this.cardEntity.setAttribute('visible', 'false');
          this.cardVisible = false;
        }
      },

      remove: function () {
        if (this.cardEntity) {
          this.cardEntity.parentNode.removeChild(this.cardEntity);
        }
      }
    });
  </script>

  <style>
    .instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 1000;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <a-scene environment="preset: default; groundColor: #445; grid: cross" cursor="rayOrigin: mouse">
    
    <a-assets>
      <a-asset-item id="glb-mano" src="assets/mano_virtuale.glb"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0"></a-camera>

      <!-- Controller sinistro con teleport e laser sincronizzati -->
      <a-entity 
        id="leftHand"
        laser-controls="hand: left" 
        raycaster="objects: .interattivo; far: 10; showLine: true; lineColor: #ffffff; lineOpacity: 0.8"
        line="color: #ffffff; opacity: 0.8"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #ffffff; curveOpacity: 0.8; curveStyle: straight; rotateOnTeleport: false"
        sync-teleport-laser
        info-card="title: Corso Sicurezza; description: Questo è un box dimostrativo per il corso di formazione sulla sicurezza sul lavoro.">
        
        <a-entity 
          gltf-model="#glb-mano" 
          fix-rotazione-mani="rotazione: 90 180 0">
        </a-entity>
      </a-entity>

      <!-- Controller destro con teleport e laser sincronizzati -->
      <a-entity 
        id="rightHand"
        laser-controls="hand: right" 
        raycaster="objects: .interattivo; far: 10; showLine: true; lineColor: #ffffff; lineOpacity: 0.8"
        line="color: #ffffff; opacity: 0.8"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #ffffff; curveOpacity: 0.8; curveStyle: straight; rotateOnTeleport: false"
        sync-teleport-laser>
        
        <a-entity 
          gltf-model="#glb-mano" 
          fix-rotazione-mani="rotazione: 90 0 0"> 
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Piano navigabile trasparente -->
    <a-plane class="navigabile" rotation="-90 0 0" width="30" height="30" material="opacity: 0; transparent: true"></a-plane>

    <!-- Tre solidi interattivi con outline bianco -->
    <a-box 
      id="box-sicurezza"
      position="-2 1.2 -3" 
      color="#4cc9f0" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;">
    </a-box>

    <a-sphere 
      id="sphere-sicurezza"
      position="0 1.2 -3" 
      radius="0.5" 
      color="#f72585" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;">
    </a-sphere>

    <a-cone 
      id="cone-sicurezza"
      position="2 1.2 -3" 
      color="#7209b7" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;">
    </a-cone>

  </a-scene>

  <div class="instructions">
    🖐️ Entrambe le mani: Trigger per Teletrasporto<br>
    📄 Tasto X (sinistra) o A (destra): Apri scheda informativa<br>
    ✕ Clicca X rossa per chiudere la scheda
  </div>

</body>
</html>
