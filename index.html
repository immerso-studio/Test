<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Sito VR Interattivo - A-Frame & Three.js</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
  
  <script>
    // Componente personalizzato che unisce A-Frame e Three.js per il Drag & Drop
    AFRAME.registerComponent('vr-drag-drop', {
      init: function () {
        const el = this.el;

        // Funzione di rilascio dell'oggetto
        this.onRelease = (evt) => {
          if (this.grabbingController) {
            // Three.js: Riaggancia l'oggetto alla scena globale mantenendo la nuova posizione
            const sceneEl = document.querySelector('a-scene');
            sceneEl.object3D.attach(el.object3D);
            this.grabbingController = null;
          }
        };

        // Funzione di presa dell'oggetto (attivata dal trigger del controller o click del mouse)
        el.addEventListener('mousedown', (evt) => {
          // Trova l'entità che sta interagendo (il controller VR o il puntatore mouse)
          this.grabbingController = evt.detail.cursorEl;
          
          if (this.grabbingController) {
            // Three.js: Aggancia l'oggetto al controller preservando la sua posizione nel mondo
            this.grabbingController.object3D.attach(el.object3D);
            
            // Ascolta il rilascio direttamente sul controller per evitare di perdere l'input se ti muovi veloce
            this.grabbingController.addEventListener('mouseup', this.onRelease, { once: true });
          }
        });
      }
    });
  </script>
</head>
<body>

  <a-scene environment="preset: default; groundColor: #445; grid: cross" 
           cursor="rayOrigin: mouse; fuse: false" 
           raycaster="objects: .interactive">
    
    <a-entity id="rig">
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
      
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .interactive; far: 10"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .interactive; far: 10"></a-entity>
    </a-entity>

    <a-box class="interactive" vr-drag-drop 
           position="-1 1.5 -3" 
           rotation="0 45 0" 
           color="#4CC3D9" 
           scale="0.6 0.6 0.6">
    </a-box>

    <a-sphere class="interactive" vr-drag-drop 
              position="0 1.5 -4" 
              radius="0.4" 
              color="#EF2D5E">
    </a-sphere>

    <a-cylinder class="interactive" vr-drag-drop 
                position="1 1.5 -3" 
                radius="0.3" 
                height="0.8" 
                color="#FFC65D">
    </a-cylinder>

  </a-scene>

</body>
</html>
