<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corso VR - Formazione Sicurezza</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <script>
    // Corregge la rotazione del modello .GLB delle mani
    AFRAME.registerComponent('fix-rotazione-mani', {
      schema: {
        rotazione: {type: 'vec3', default: {x: 90, y: 180, z: 0}}
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          this.el.setAttribute('rotation', this.data.rotazione);
        });
      }
    });

    // Outline bianco puro senza riempimento
    AFRAME.registerComponent('outline', {
      schema: {
        color: {default: '#ffffff'},
        scale: {default: 1.08},
        pulse: {default: false},
        frequency: {default: 1}
      },

      init: function () {
        this.el.addEventListener('loaded', () => {
          this.createOutline();
        });

        this.el.addEventListener('raycaster-intersected', () => {
          if (this.outlineMesh) {
            this.outlineMesh.visible = true;
          }
        });
        
        this.el.addEventListener('raycaster-intersected-cleared', () => {
          if (this.outlineMesh) {
            this.outlineMesh.visible = false;
          }
        });
      },

      createOutline: function () {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) {
          console.warn('outline: nessuna mesh trovata per', this.el);
          return;
        }

        const geometry = mesh.geometry.clone();
        
        const material = new THREE.MeshBasicMaterial({
          color: this.data.color,
          side: THREE.BackSide,
          depthTest: false,
          depthWrite: false,
          transparent: true,
          opacity: 1.0,
        });

        this.outlineMesh = new THREE.Mesh(geometry, material);
        this.outlineMesh.scale.setScalar(this.data.scale);
        this.outlineMesh.visible = false;
        this.outlineMesh.renderOrder = 999;
        
        this.el.object3D.add(this.outlineMesh);
      },

      tick: function (t) {
        if (this.data.pulse && this.outlineMesh) {
          const s = this.data.scale + 0.02 * Math.sin(this.data.frequency * t / 120);
          this.outlineMesh.scale.setScalar(s);
        }
      }
    });

    // Componente per sincronizzare teleport e laser
    AFRAME.registerComponent('sync-teleport-laser', {
      init: function () {
        this.synced = false;
        
        this.el.addEventListener('loaded', () => {
          this.setupSync();
        });
        
        setTimeout(() => {
          if (!this.synced) this.setupSync();
        }, 1000);
      },

      setupSync: function () {
        const blinkControls = this.el.components['blink-controls'];
        const raycaster = this.el.components['raycaster'];
        
        if (!blinkControls || !raycaster) return;
        
        blinkControls.data.curveTint = '#ffffff';
        blinkControls.data.curveOpacity = 0.8;
        
        if (blinkControls.raycaster && raycaster.raycaster) {
          Object.defineProperty(blinkControls, 'raycaster', {
            get: function() { return raycaster.raycaster; },
            configurable: true
          });
        }
        
        this.synced = true;
      },

      tick: function () {
        const blinkControls = this.el.components['blink-controls'];
        const raycaster = this.el.components['raycaster'];
        
        if (!blinkControls || !raycaster) return;
        
        if (blinkControls.curveMaterial) {
          blinkControls.curveMaterial.color.set('#ffffff');
          blinkControls.curveMaterial.opacity = 0.8;
        }
        
        if (raycaster.line) {
          if (blinkControls.isTeleporting) {
            raycaster.line.visible = false;
          } else if (raycaster.data.showLine) {
            raycaster.line.visible = true;
          }
        }
      }
    });

    // Sistema globale per gestire le schede informative (COMPATTO & ANIMATO)
    AFRAME.registerSystem('info-card-system', {
      init: function () {
        this.activeCard = null;
        this.cardData = null;
        this.isCardOpen = false;
      },

      createCard: function (data) {
        // Rimuovi scheda esistente se presente
        this.hideCard();

        const camera = document.querySelector('#camera');
        if (!camera) return;

        // Crea la scheda come child della camera
        const card = document.createElement('a-entity');
        card.setAttribute('id', 'info-card-follow');
        // Posizionata centralmente, leggermente abbassata rispetto agli occhi
        card.setAttribute('position', '0 -0.15 -1');
        
        // Animazione pop-up di apertura (effetto scala elastico)
        card.setAttribute('animation', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 400; easing: easeOutElastic');
        
        // Struttura della scheda compatta con intestazione nativa
        card.innerHTML = `
          <a-plane 
            position="0 0 0" 
            width="0.8" 
            height="0.45" 
            color="#22222b" 
            material="shader: flat; opacity: 0.95; transparent: true; depthTest: false">
          </a-plane>
          
          <a-plane 
            position="0 0.205 0.001" 
            width="0.8" 
            height="0.04" 
            color="#4cc9f0" 
            material="shader: flat; depthTest: false">
          </a-plane>

          <a-text 
            position="-0.36 0.16 0.002" 
            value="i" 
            align="center" 
            color="#4cc9f0" 
            width="0.4"
            font="mozillavr">
          </a-text>
          
          <a-text 
            position="-0.32 0.16 0.002" 
            value="${data.title || 'Informazioni'}" 
            align="left" 
            color="#ffffff" 
            width="0.7"
            font="mozillavr">
          </a-text>
          
          <a-text 
            position="-0.36 0.05 0.002" 
            value="${data.description || 'Nessuna descrizione disponibile'}" 
            align="left" 
            baseline="top"
            color="#dcdcdc" 
            width="0.72"
            wrap-count="42"
            font="mozillavr">
          </a-text>
          
          <a-entity id="close-container" position="0.34 0.16 0.002">
            <a-circle 
              id="close-button-bg"
              radius="0.035" 
              color="#ff3333"
              material="shader: flat; depthTest: false"
              class="close-button close-interactive">
            </a-circle>
            
            <a-text 
              id="close-button-text"
              position="0 0.002 0.001"
              value="X" 
              align="center" 
              color="#ffffff" 
              width="0.2"
              font="mozillavr"
              class="close-button close-interactive">
            </a-text>
          </a-entity>
        `;
        
        camera.appendChild(card);
        this.activeCard = card;
        this.cardData = data;
        this.isCardOpen = true;

        // Disabilita il teletrasporto durante l'interazione
        this.disableTeleport();
        
        // Isola i raycaster per cliccare solo sulla X di chiusura
        this.updateControllerRaycasters(true);

        // Listener per gli effetti hover ed eventi di chiusura
        setTimeout(() => {
          this.setupCloseButtonListeners();
        }, 200);
      },

      setupCloseButtonListeners: function () {
        const closeBg = document.querySelector('#close-button-bg');
        const closeText = document.querySelector('#close-button-text');
        
        const addHoverEffect = (element) => {
          if (!element) return;
          
          element.addEventListener('mouseenter', () => {
            if (closeBg) closeBg.setAttribute('color', '#ff6666');
            if (closeBg) closeBg.setAttribute('scale', '1.15 1.15 1.15');
            if (closeText) closeText.setAttribute('scale', '1.15 1.15 1.15');
          });
          
          element.addEventListener('mouseleave', () => {
            if (closeBg) closeBg.setAttribute('color', '#ff3333');
            if (closeBg) closeBg.setAttribute('scale', '1 1 1');
            if (closeText) closeText.setAttribute('scale', '1 1 1');
          });
          
          element.addEventListener('click', () => {
            if(this.activeCard) {
              // Animazione di chiusura (collasso) prima della rimozione dal DOM
              this.activeCard.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 200; easing: easeInBack');
              setTimeout(() => this.hideCard(), 200);
            }
          });
        };
        
        addHoverEffect(closeBg);
        addHoverEffect(closeText);
      },

      updateControllerRaycasters: function (cardOpen) {
        const leftHand = document.querySelector('#leftHand');
        const rightHand = document.querySelector('#rightHand');
        
        if (leftHand && leftHand.components['raycaster']) {
          leftHand.setAttribute('raycaster', 'objects', cardOpen ? '.close-interactive' : '.interattivo');
        }
        if (rightHand && rightHand.components['raycaster']) {
          rightHand.setAttribute('raycaster', 'objects', cardOpen ? '.close-interactive' : '.interattivo');
        }
      },

      disableTeleport: function () {
        const leftHand = document.querySelector('#leftHand');
        const rightHand = document.querySelector('#rightHand');
        
        if (leftHand && leftHand.components['blink-controls']) leftHand.setAttribute('blink-controls', 'enabled', false);
        if (rightHand && rightHand.components['blink-controls']) rightHand.setAttribute('blink-controls', 'enabled', false);
      },

      enableTeleport: function () {
        const leftHand = document.querySelector('#leftHand');
        const rightHand = document.querySelector('#rightHand');
        
        if (leftHand && leftHand.components['blink-controls']) leftHand.setAttribute('blink-controls', 'enabled', true);
        if (rightHand && rightHand.components['blink-controls']) rightHand.setAttribute('blink-controls', 'enabled', true);
      },

      hideCard: function () {
        if (this.activeCard && this.activeCard.parentNode) {
          this.activeCard.parentNode.removeChild(this.activeCard);
        }
        this.activeCard = null;
        this.cardData = null;
        this.isCardOpen = false;
        
        this.enableTeleport();
        this.updateControllerRaycasters(false);
      },

      isCardVisible: function () {
        return this.isCardOpen;
      }
    });

    // Componente per gestire l'apertura delle schede dagli oggetti
    AFRAME.registerComponent('info-card-trigger', {
      schema: {
        title: {type: 'string', default: 'Informazioni'},
        description: {type: 'string', default: 'Descrizione dettagliata dell\'oggetto selezionato.'}
      },

      init: function () {
        this.system = document.querySelector('a-scene').systems['info-card-system'];
        
        this.el.addEventListener('raycaster-intersected', (e) => {
          this.intersected = true;
        });
        
        this.el.addEventListener('raycaster-intersected-cleared', (e) => {
          this.intersected = false;
        });
      },

      openCard: function () {
        if (this.intersected && this.system && !this.system.isCardVisible()) {
          this.system.createCard({
            title: this.data.title,
            description: this.data.description
          });
        }
      }
    });

    // Componente per gestire gli input dei controller
    AFRAME.registerComponent('controller-input', {
      init: function () {
        this.system = document.querySelector('a-scene').systems['info-card-system'];
        
        this.el.addEventListener('xbuttondown', () => { this.triggerInfoCard(); });
        this.el.addEventListener('abuttondown', () => { this.triggerInfoCard(); });
        this.el.addEventListener('click', () => { this.triggerInfoCard(); });
      },

      triggerInfoCard: function () {
        const intersectedObjects = document.querySelectorAll('.interattivo');
        let activeObject = null;
        
        intersectedObjects.forEach(obj => {
          if (obj.components['info-card-trigger'] && obj.components['info-card-trigger'].intersected) {
            activeObject = obj;
          }
        });
        
        if (activeObject && !this.system.isCardVisible()) {
          activeObject.components['info-card-trigger'].openCard();
        }
      }
    });
  </script>

  <style>
    .instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 1000;
      text-align: center;
      line-height: 1.6;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <a-scene environment="preset: default; groundColor: #445; grid: cross" cursor="rayOrigin: mouse">
    
    <a-assets>
      <a-asset-item id="glb-mano" src="assets/mano_virtuale.glb"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0"></a-camera>

      <a-entity 
        id="leftHand"
        laser-controls="hand: left" 
        raycaster="objects: .interattivo; far: 10; showLine: true; lineColor: #ffffff; lineOpacity: 0.8"
        line="color: #ffffff; opacity: 0.8"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #ffffff; curveOpacity: 0.8; curveStyle: straight; rotateOnTeleport: false"
        sync-teleport-laser
        controller-input>
        
        <a-entity 
          gltf-model="#glb-mano" 
          fix-rotazione-mani="rotazione: 90 180 0">
        </a-entity>
      </a-entity>

      <a-entity 
        id="rightHand"
        laser-controls="hand: right" 
        raycaster="objects: .interattivo; far: 10; showLine: true; lineColor: #ffffff; lineOpacity: 0.8"
        line="color: #ffffff; opacity: 0.8"
        blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .navigabile; button: trigger; curveTint: #ffffff; curveOpacity: 0.8; curveStyle: straight; rotateOnTeleport: false"
        sync-teleport-laser
        controller-input>
        
        <a-entity 
          gltf-model="#glb-mano" 
          fix-rotazione-mani="rotazione: 90 0 0"> 
        </a-entity>
      </a-entity>
    </a-entity>

    <a-plane class="navigabile" rotation="-90 0 0" width="30" height="30" material="opacity: 0; transparent: true"></a-plane>

    <a-box 
      id="box-sicurezza"
      position="-2 1.2 -3" 
      color="#4cc9f0" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;"
      info-card-trigger="title: Box Sicurezza; description: Questo box rappresenta un modulo di sicurezza base. Contiene informazioni essenziali per la protezione sul lavoro e le normative vigenti ambientali.">
    </a-box>

    <a-sphere 
      id="sphere-sicurezza"
      position="0 1.2 -3" 
      radius="0.5" 
      color="#f72585" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;"
      info-card-trigger="title: Sfera Interattiva; description: Elemento sferico per esercitazioni pratiche di formazione VR. Tocca per maggiori dettagli sulla sicurezza e la gestione dei rischi sul cantiere.">
    </a-sphere>

    <a-cone 
      id="cone-sicurezza"
      position="2 1.2 -3" 
      color="#7209b7" 
      class="interattivo" 
      outline="color: #ffffff; scale: 1.08; pulse: false;"
      info-card-trigger="title: Cono Segnaletico; description: Rappresenta un punto di interesse per la segnaletica di sicurezza. Importante per la prevenzione di incidenti e la corretta delimitazione delle zone di pericolo.">
    </a-cone>

  </a-scene>

  <div class="instructions">
    🖐️ Entrambe le mani: Trigger per Teletrasporto<br>
    📄 Tasto X (sinistra) o A (destra) / Click Mouse: Apri scheda<br>
    ✕ Clicca il cerchio rosso in alto a destra per chiudere la scheda fluttuante<br>
    🔒 Durante la lettura: solo il tasto X di chiusura risponderà ai puntatori
  </div>

</body>
</html>
